<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b5bd6">
<title>Mete · Gelişim Robotu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1e293b;--mut:#64748b;--pri:#5b5bd6;--pri-s:#eef0ff;--ok:#16a34a;--ok-s:#dcfce7;--y:#b45309;--y-s:#fef3c7;--bad:#dc2626;--bad-s:#fee2e2;--line:#e5e7ef;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(243,245,251,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top b{display:block;font-size:17px}.top small{color:var(--mut)}
.live{font-size:12px;color:var(--ok);background:var(--ok-s);padding:5px 10px;border-radius:99px;font-weight:700;white-space:nowrap;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05)}
h3{margin:0 0 10px;font-size:17px}
.sub{margin:18px 4px 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.mut{color:var(--mut);font-size:14px}
p{margin:6px 0}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=number]{width:84px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;margin:4px 0;text-align:center}
.btn.ghost{background:var(--pri-s);color:var(--pri)}
.btn.danger{background:var(--bad-s);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{width:100%;padding:16px;font-size:17px;margin-top:14px}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.file input{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;color:var(--mut);border-radius:12px;max-width:140px;margin:0 auto}
.nav span{font-size:21px}.nav small{font-size:10.5px;font-weight:700}
.nav .on{color:var(--pri);background:var(--pri-s)}
.hero{background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:#fff}
.hero .mut{color:#e0e7ff}
.garage{display:flex;align-items:center;gap:14px}
.bot{font-size:64px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.part{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;filter:grayscale(1);opacity:.4}
.part.on{filter:none;opacity:1;background:rgba(255,255,255,.3)}
.nx{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:10px}.nx i{display:block;height:100%;background:#fde047;border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:20px}.stats small{font-size:11px;color:var(--mut)}
.node{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);width:88%;border:0;text-align:left}
.node.r{margin-left:12%}
.node b{display:block}.node small{color:var(--mut)}
.bub{position:relative;width:54px;height:54px;border-radius:50%;flex:none;background:conic-gradient(var(--c,var(--pri)) calc(var(--p)*1%),#e5e7ef 0)}
.bub span{position:absolute;inset:5px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.node.tamam .bub{--c:var(--ok)}.node.bekliyor{opacity:.75}
.steps{margin:0;padding-left:20px}.steps li{margin:6px 0}
#modal{position:fixed;inset:0;z-index:160;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{background:#fff;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:760px){#modal{align-items:center}.mbox{border-radius:22px}}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.wc{border:1px solid var(--line);background:#fbfcff;border-radius:99px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:99px;border:1px dashed #cbd2e3;color:var(--mut);font-size:14px;background:#fff}.chip.on{border:1px solid var(--pri);background:var(--pri-s);color:var(--pri);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:22px}
.sbtn small{font-size:16px;font-weight:400}.sbtn.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:250;background:rgba(255,255,255,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600;text-align:center;padding:24px}
#busy.on{display:flex}
.pbar{width:min(80vw,320px);height:10px;border-radius:9px;background:#e5e7ef;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.spin{font-size:56px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.mood,.rate{display:flex;gap:8px}.mood button,.rate button{flex:1;border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:10px;font-size:22px}.rate button{font-size:16px;font-weight:700}.mood .on,.rate .on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
.urow{display:flex;align-items:center;gap:8px;margin:6px 0}.urow label{margin:0;flex:1;color:var(--ink);font-weight:500;display:flex;gap:8px;align-items:center;font-size:15px}.urow input{width:auto}.urow select{width:auto;padding:6px 8px;font-size:13px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rf{width:100%;border:0;border-radius:14px;background:#fff;min-height:420px;display:block}
.pv{position:relative}.pv img{width:100%;border-radius:10px;margin-top:10px;background:#f8fafc;min-height:200px;display:block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.it>div{flex:1;min-width:0}.it small{color:var(--mut);display:block}
.it .ic{font-size:26px}
.tg{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;font-size:15px}.tg input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;color:var(--mut)}.seg .on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{border:2px dashed #c7cdf0;border-radius:16px;padding:22px 12px;text-align:center;background:#fafbff;cursor:pointer;display:block}
.drop b{display:block;font-size:17px;color:var(--pri)}.drop.hov{background:var(--pri-s);border-color:var(--pri)}
.scard{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sL{width:52px;height:52px;flex:none;border-radius:14px;background:var(--pri-s);color:var(--pri);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sbar{height:12px;border-radius:8px;background:#eceef5;overflow:hidden;margin:6px 0 2px}.sbar i{display:block;height:100%;border-radius:8px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.cnt button{border:0;border-radius:16px;padding:16px 4px;font-weight:800;font-size:18px}
.cnt .g{background:var(--ok-s);color:var(--ok)}.cnt .y{background:var(--y-s);color:var(--y)}.cnt .n{background:#f1f5f9;color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.gal button{border:0;padding:0;background:#f1f5f9;border-radius:12px;overflow:hidden;aspect-ratio:3/4}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.recrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.recrow>div{flex:1;min-width:0}.recrow small{display:block;color:var(--mut)}
.recrow button{border:0;background:var(--pri-s);color:var(--pri);border-radius:10px;width:40px;height:40px;font-size:18px}
.recrow .st.on{background:#fef3c7}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.goal>div{flex:1}.goal small{color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--pri-s);color:var(--pri)}.badge.ok{background:var(--ok-s);color:var(--ok)}
/* ===== ÇOCUK EKRANI ===== */
.kid{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#eef2ff,#ecfdf5);display:flex;flex-direction:column;overflow:auto;user-select:none;-webkit-user-select:none}
.kbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;gap:8px}
.lock{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:20px;opacity:.45;transition:transform 1.2s,opacity .3s;touch-action:none}
.lock.hold{transform:scale(1.35);opacity:1;background:#fde68a}
.kst{font-size:22px;font-weight:800;background:#fff;padding:6px 16px;border-radius:99px;box-shadow:0 3px 0 #dfe3f3}
@media(max-width:520px){.ksnd{display:none!important}.kst{font-size:18px;padding:4px 12px}}
.kbar>.row{flex-wrap:nowrap}
.ksnd{font-size:15px;font-weight:800;background:#fff;padding:6px 12px;border-radius:99px;color:var(--pri);box-shadow:0 3px 0 #dfe3f3}
.kb{width:48px;height:48px;border:0;border-radius:14px;background:#fff;font-size:24px;box-shadow:0 3px 0 #dfe3f3}
.kmain{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.khello{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:14px 20px;box-shadow:0 4px 0 #dfe3f3;width:min(100%,720px);border:0;text-align:left}
.kro{font-size:60px;animation:bob 2.4s ease-in-out infinite}
.khello b{font-size:24px;display:block}.khello small{color:var(--mut);font-size:15px}
.ktiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(100%,720px)}
.ktile{position:relative;border:0;background:#fff;border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #dfe3f3}
.kti{font-size:52px}.ktn{font-weight:700;font-size:16px}
.ktile em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;font-weight:800;background:var(--pri);color:#fff;padding:3px 8px;border-radius:99px}
.ktile.now{outline:4px solid #fbbf24}
.ktile.done{opacity:.55}.ktile.done em{background:var(--ok)}
.kq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.kbig{width:72px;height:72px;border-radius:50%;border:0;background:#fff;font-size:34px;box-shadow:0 4px 0 #dfe3f3}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:#cbd5e1}.dots i.on{background:#22c55e}
.kopts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.kcard{position:relative;width:min(29vw,180px);aspect-ratio:1;border:0;border-radius:26px;background:#fff;font-size:clamp(46px,14vw,100px);box-shadow:0 6px 0 #dfe3f3;display:flex;align-items:center;justify-content:center}
.kcard:active{transform:translateY(4px);box-shadow:0 2px 0 #dfe3f3}
.kcard.tgt{outline:6px solid #fbbf24}
.kcard .cap{position:absolute;bottom:6px;left:0;right:0;font-size:15px;font-weight:700;color:var(--mut)}
.hint{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px #fde68a}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(92vw,400px,52vh);background:#c7d2fe;padding:6px;border-radius:18px}
.rc{aspect-ratio:1;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,40px)}
.rc.w{background:#94a3b8}.rc.t{background:#fef9c3}
.prog{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:46px;align-items:center;background:#fff;border-radius:16px;padding:6px 10px;width:min(92vw,400px)}
.pc{font-size:24px;border-radius:8px;padding:0 2px}.pc.on{background:#bbf7d0}.pc.bad{background:#fecaca}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:10px}
.pad button{height:74px;border:0;border-radius:20px;background:#fff;font-size:34px;box-shadow:0 5px 0 #dfe3f3}
.pad .go{background:#22c55e;box-shadow:0 5px 0 #15803d}.pad .del{background:#fee2e2}
.pad button:disabled{opacity:.4}
.pz{display:grid;gap:5px;width:min(84vw,360px,50vh);background:#c7d2fe;padding:5px;border-radius:16px}
.pz img{width:100%;display:block;border-radius:8px;border:3px solid transparent}
.pz img.sel{border-color:#f59e0b;transform:scale(.93)}.pz img.ok{border-color:#86efac}
.pzprev{font-size:46px;background:#fff;border-radius:16px;padding:2px 12px}
.hE{font-size:clamp(90px,22vw,150px);line-height:1}
.hs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hb{border:0;border-radius:18px;padding:14px 20px;font-size:30px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .2s}
.hb.c0{background:#6366f1}.hb.c1{background:#f97316}.hb.c2{background:#10b981}.hb.c3{background:#ec4899}
.hb.lit{transform:scale(1.22) translateY(-6px)}
.kbtn{border:0;border-radius:20px;padding:16px 22px;font-size:19px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 5px 0 #3f3fb0;min-width:220px}
.kbtn.alt{background:#fff;color:var(--pri);box-shadow:0 5px 0 #dfe3f3}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.slot{width:min(24vw,116px);aspect-ratio:1;border-radius:22px;border:3px dashed #a5b4fc;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,12vw,70px);background:rgba(255,255,255,.5);position:relative}.slot small{position:absolute;top:4px;left:8px;font-size:14px;font-weight:800;color:#6366f1}
.slot.f{border-style:solid;background:#fff}
.kdone{font-size:20px;font-weight:800;background:#dcfce7;border-radius:20px;padding:14px 20px;text-align:center}
.kgar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.kgar span{font-size:28px;opacity:.22;filter:grayscale(1)}.kgar span.on{opacity:1;filter:none}
/* drill */
.track{display:flex;gap:4px;width:min(94vw,640px);background:#fff;border-radius:18px;padding:6px;box-shadow:0 4px 0 #dfe3f3;position:relative}
.track i{flex:1;height:40px;border-radius:10px;background:#eef0f6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.track i.g{background:#bbf7d0}.track i.y{background:#fde68a}.track i.n{background:#e2e8f0}.track i.cur{outline:3px solid #6366f1}
.track i.end{background:#e0e7ff}
.dcard{background:#fff;border-radius:30px;box-shadow:0 8px 0 #dfe3f3;padding:18px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:min(86vw,360px);border:0}
.dE{font-size:clamp(90px,24vw,170px);line-height:1.05}
.dW{font-size:clamp(28px,7vw,46px);font-weight:800;letter-spacing:.02em;text-align:center}
.dW .hl{color:#e11d48;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.syl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.syl span{font-size:clamp(46px,12vw,80px);font-weight:900;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-radius:22px;padding:6px 22px}
.tbar{position:sticky;bottom:0;display:flex;gap:8px;width:min(96vw,640px);background:rgba(255,255,255,.95);border-radius:20px;padding:8px;box-shadow:0 -2px 14px rgba(15,23,42,.08);margin-top:auto}
.tbar button{flex:1;border:0;border-radius:14px;padding:12px 4px;font-weight:800;font-size:15px}
.tbar .g{background:var(--ok-s);color:var(--ok)}.tbar .y{background:var(--y-s);color:var(--y)}.tbar .n{background:#f1f5f9;color:var(--mut)}
.tbar .rec{flex:0 0 56px;background:#fee2e2;color:#dc2626;font-size:20px}.tbar .rec.on{background:#dc2626;color:#fff;animation:pulse 1s infinite}
.tlab{font-size:11px;color:var(--mut);font-weight:700;text-align:center;width:100%}
.train{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.train button{border:0;background:#fff;border-radius:18px;padding:10px 14px;font-size:30px;box-shadow:0 5px 0 #dfe3f3;white-space:nowrap}
.mpwrap{position:relative;display:flex;gap:min(10vw,80px);justify-content:center;align-items:center;margin-top:20px}
.mpbot{font-size:64px;transition:transform .7s cubic-bezier(.5,1.6,.5,1)}
.mode2{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#sp{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px}
#sp.on{display:flex}
.spbox{background:#fff;border-radius:28px;padding:22px;width:min(100%,460px);text-align:center}
.spE{font-size:92px;line-height:1.1}.spW{font-size:30px;font-weight:800;margin:6px 0 10px}
.spW .hl{color:#e11d48}
.say{border:0;background:var(--pri-s);color:var(--pri);border-radius:99px;padding:10px 18px;font-weight:700}
.sprow{display:grid;grid-template-columns:repeat(3,1fr) 56px;gap:8px;margin-top:16px}
.sprow button{border:0;border-radius:16px;padding:14px 4px;font-weight:700;font-size:14px}

/* ================== HECE & SES KONUMU ================== */
const VOW = "aeıioöuüâîû";
function hece(w) {
  const s = [...low(w)];
  const vi = [];
  s.forEach((c, i) => {
    if (VOW.includes(c)) vi.push(i);
  });
  if (vi.length < 2) return [w];
  const cuts = [];
  for (let k = 1; k < vi.length; k++) {
    const a = vi[k - 1],
      b = vi[k];
    cuts.push(b - a - 1 <= 0 ? b : b - 1);
  }
  const out = [];
  let st = 0;
  cuts.forEach((c) => {
    out.push(s.slice(st, c).join(""));
    st = c;
  });
  out.push(s.slice(st).join(""));
  return out.filter(Boolean);
}
const heceOf = (w) => String(w).trim().split(/\s+/).flatMap(hece);
function posOf(w, s) {
  const l = low(w);
  const r = new Set();
  if (!s || !l.includes(s)) return r;
  if (l.startsWith(s)) r.add("bas");
  if (l.endsWith(s)) r.add("son");
  for (let i = 1; i < l.length - 1; i++) if (l[i] === s) r.add("orta");
  return r;
}
function hlWord(w, s) {
  if (!s) return esc(w);
  return [...String(w)].map((c) => (low(c) === s ? `<span class="hl">${esc(c)}</span>` : esc(c))).join("");
}
function sylls(s) {
  const V = "aeıiouöü";
  const cv = [...V].map((v) => s + v),
    vc = [...V].map((v) => v + s),
    vcv = ["a", "e", "i", "o", "u"].map((v) => v + s + v);
  return { cv, vc, vcv };
}

    const l = o.lv[t.lvl] || (o.lv[t.lvl] = { n: 0, p: 0 });

      q.n++;

  Object.values(by).forEach((o) => {

/* ================== DEPOLAMA (IndexedDB) ================== */
let _db = null;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open("mete_dk", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("f");
    r.onsuccess = () => {
      _db = r.result;
      res(_db);
    };
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("f", "readwrite");
    tx.objectStore("f").put(v, k);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("Depolama dolu"));
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("f", "readonly");
    const r = tx.objectStore("f").get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbDel(k) {
  const db = await idb();
  return new Promise((res) => {
    const tx = db.transaction("f", "readwrite");
    tx.objectStore("f").delete(k);
    tx.oncomplete = () => res();
    tx.onerror = () => res();
  });
}
const blobToData = (b) =>
  new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(b);
  });
async function dataToBlob(d) {
  return (await fetch(d)).blob();
}

/* ================== KİTAPLAR (PDF + fotoğraf) ================== */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
async function ensurePdfjs() {
  if (window.pdfjsLib) return;
  await loadJs(PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
const bookOf = (id) => S.books.find((b) => b.id === id);
async function getPdf(b) {
  if (PDFS[b.id]) return PDFS[b.id];
  await ensurePdfjs();
  let buf = null;
  try {
    buf = await idbGet(b.key);
  } catch (e) {}
  if (!buf) return null;
  PDFS[b.id] = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false })
    .promise;
  return PDFS[b.id];
}
async function pageImg(bookId, n, w, q) {
  const b = bookOf(bookId);
  if (!b) throw new Error("Kitap bulunamadı");
  if (b.type === "img") {
    const arr = PDFS[b.id] || (PDFS[b.id] = await idbGet(b.key));
    if (!arr || !arr[n - 1]) throw new Error("Sayfa bulunamadı");
    return arr[n - 1];
  }
  const pdf = await getPdf(b);
  if (!pdf) throw new Error("PDF cihazda bulunamadı, Kitap sekmesinden yeniden yükle");
  const p = await pdf.getPage(n);
  const v0 = p.getViewport({ scale: 1 });
  const v = p.getViewport({ scale: (w || 1000) / v0.width });
  const c = document.createElement("canvas");
  c.width = Math.round(v.width);
  c.height = Math.round(v.height);
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, c.width, c.height);
  await p.render({ canvasContext: g, viewport: v }).promise;
  return c.toDataURL("image/jpeg", q || 0.75);
}
function fileSize(n) {
  return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
}
async function addBookFiles(files) {
  files = [...(files || [])];
  if (!files.length) return;
  const pdfs = files.filter((f) => /pdf/i.test(f.type) || /\.pdf$/i.test(f.name));
  const imgs = files.filter((f) => /^image\//.test(f.type));
  for (const f of pdfs) await addPdf(f);
  if (imgs.length) await addImgBook(imgs);
  render();
}
async function addPdf(f) {
  busy(`“${f.name}” okunuyor… (${fileSize(f.size)})`, 5);
  try {
    if (f.size > 250 * 1048576)
      throw new Error(
        "Dosya çok büyük (" + fileSize(f.size) + "). PDF'i parçalara böl ya da sayfaların fotoğrafını yükle.",
      );
    const buf = await f.arrayBuffer();
    busy("PDF kütüphanesi hazırlanıyor…", 20);
    await ensurePdfjs();
    busy("Sayfalar sayılıyor…", 35);
    const task = pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false });
    task.onProgress = (p) => {
      if (p.total) busy("PDF açılıyor…", 35 + Math.round((40 * p.loaded) / p.total));
    };
    const pdf = await task.promise;
    const id = uid();
    const b = {
      id,
      name: f.name.replace(/\.pdf$/i, ""),
      pages: pdf.numPages,
      type: "pdf",
      key: "book:" + id,
      added: Date.now(),
      size: f.size,
    };
    busy("Cihaza kaydediliyor…", 85);
    let stored = true;
    try {
      await idbSet(b.key, buf);
    } catch (e) {
      stored = false;
    }
    PDFS[id] = pdf;
    S.books.push(b);
    pvBook = id;
    pvPage = 1;
    save();
    toast(
      `✅ ${pdf.numPages} sayfa yüklendi${stored ? "" : " (cihaza kaydedilemedi — sadece bu oturumda açık)"}`,
    );
  } catch (e) {
    toast(
      "PDF açılamadı: " + (e.message || e) + (String(e.message).includes("password") ? " (şifreli PDF)" : ""),
    );
  } finally {
    busy(false);
  }
}
async function shrinkImg(f, max) {
  max = max || 1400;
  const url = URL.createObjectURL(f);
  try {
    const im = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("Görsel açılamadı: " + f.name));
      i.src = url;
    });
    const k = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement("canvas");
    c.width = Math.round(im.width * k);
    c.height = Math.round(im.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff";
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(im, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } finally {
    URL.revokeObjectURL(url);
  }
}
async function addImgBook(files) {

/* ================== GEMINI ================== */
const im = (d) => ({ inline_data: { mime_type: "image/jpeg", data: d.split(",")[1] } });
async function gemini(parts) {
  const keys = String(S.settings.keys || "")
    .split(/\s+/)
    .filter(Boolean);
  if (!keys.length) throw new Error("Ayarlar sekmesinden Gemini API anahtarı ekle");
  let last;
  for (let t = 0; t < keys.length; t++) {
    const ix = (keyIx + t) % keys.length;
    try {
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.model || "gemini-2.5-flash")}:generateContent?key=${encodeURIComponent(keys[ix])}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts }],
            generationConfig: { temperature: 0.6, responseMimeType: "application/json" },
          }),
        },
      );
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && j.error.message) || "HTTP " + r.status);
      keyIx = (ix + 1) % keys.length;
      const txt = (
        (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) ||
        []
      )
        .map((p) => p.text || "")
        .join("");
      return JSON.parse(
        txt
          .replace(/^\s*```(json)?/i, "")
          .replace(/```\s*$/, "")
          .trim(),
      );
    } catch (e) {
      last = e;
    }
  }
  throw last;
}

function actPrompt(u) {
  const snd = activeSounds();
  return `Görseller bir dil ve konuşma kitabının "${u.title}" ünitesine ait sayfalar${u.goal ? " (hedef: " + u.goal + ")" : ""}. ${ctx()}\nBu sayfalardaki hedef kelime ve kavramlardan etkinlik içeriği üret.${snd.length ? ` Mümkün olduğunca hedef sesleri (${snd.join(", ")}) farklı konumlarda (başta, ortada, sonda) içeren kelimeler seç.` : ""} Kelimeler somut ve TEK bir emoji ile net gösterilebilir olmalı. Sadece şu JSON'u döndür:\n{"hedef":"kısa hedef","kelimeler":[{"kelime":"elma","emoji":"🍎","renk":"kırmızı"}],"siralamalar":[[{"emoji":"🥚","ifade":"yumurta"},{"emoji":"🐣","ifade":"civciv"},{"emoji":"🐔","ifade":"tavuk"}]],"cumleler":["iki-üç kelimelik hedef cümle"],"ev":"ailenin evde 5 dakikada oynayabileceği kısa oyun"}\nKurallar: 10-14 tek kelimelik kelime; 2-4 adet 3 adımlı önce-sonra sıralaması; 3-5 cümle. "renk" sadece nesnenin tipik rengi belliyse ve şu listedense: kırmızı, mavi, sarı, yeşil, turuncu, mor, pembe, kahverengi, siyah, beyaz.`;
}
function applyAi(u, r) {
  const ws = (r.kelimeler || [])
    .filter((k) => k && k.kelime && k.emoji)
    .map((k) => ({ w: low(k.kelime), e: String(k.emoji).trim(), c: COLORS[low(k.renk)] ? low(k.renk) : "" }));
  if (ws.length) u.words = ws;
  const sq = (r.siralamalar || [])
    .filter((a) => Array.isArray(a) && a.length >= 3)
    .map((a) => a.slice(0, 4).map((x) => ({ e: x.emoji || "❓", t: String(x.ifade || "") })));
  if (sq.length) u.seq = sq;
  if (Array.isArray(r.cumleler)) u.sent = r.cumleler.map(String);
  if (r.ev) u.home = String(r.ev);
  if (!u.goal && r.hedef) u.goal = String(r.hedef);
}
async function aiActs(id, bulk) {
  const u = S.units.find((x) => x.id === id);
  if (!u) return false;
  const b = bookOf(u.bookId);
  if (!bulk && !b && !confirm("Bu ünitenin kitabı yüklü değil. Sadece başlığa göre üretilsin mi?"))
    return false;
  if (!bulk) busy(`“${u.title}” için etkinlikler hazırlanıyor…`);
  try {
    const parts = [{ text: actPrompt(u) }];
    if (b) {
      const a = Math.max(1, u.from | 0),
        z = Math.min(b.pages, Math.max(u.to | 0, a));
      const step = Math.max(1, Math.ceil((z - a + 1) / 8));
      for (let p = a; p <= z; p += step) parts.push(im(await pageImg(b.id, p, 1000)));
    }
    applyAi(u, await gemini(parts));
    save();
    if (!bulk) {
      toast("Etkinlikler hazır");
      openUnit(id);
    }
    return true;
  } catch (e) {
    toast("AI hatası: " + e.message);
    return false;
  } finally {
    if (!bulk) busy(false);
  }
}
async function aiAll() {
  const list = S.units.filter((u) => !u.words || u.words.length < 3);
  if (!list.length) return toast("Tüm ünitelerin etkinlikleri hazır");

}

/* ================== SES KAYDI ================== */
const REC = { mr: null, timer: null };
function recUI() {
  document.querySelectorAll(".rec").forEach((b) => b.classList.toggle("on", !!REC.mr));
}
async function recToggle(meta) {
  if (REC.mr) {
    try {
      REC.mr.stop();
    } catch (e) {}
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder)
    return toast("Bu tarayıcı ses kaydını desteklemiyor (Safari/Chrome güncel olmalı)");
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    return toast(
      "Mikrofon izni verilmedi" +
        (location.protocol === "file:" ? " — sistemi internetteki sitenden aç" : ""),
    );
  }
  const mime =
    ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg"].find(
      (m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m),
    ) || "";
  let mr;
  try {
    mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    return toast("Kayıt başlatılamadı");
  }
  const chunks = [];
  const t0 = Date.now();
  const m = Object.assign({}, meta || {});
  mr.ondataavailable = (e) => {
    if (e.data && e.data.size) chunks.push(e.data);
  };
  mr.onstop = async () => {
    clearTimeout(REC.timer);
    stream.getTracks().forEach((t) => t.stop());
    REC.mr = null;
    recUI();
    if (!chunks.length) return;
    const blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/mp4" });
    const id = uid();
    try {
      await idbSet("rec:" + id, blob);
    } catch (e) {
      return toast("Kayıt cihaza yazılamadı");
    }
    const c = ensureSession();
    S.recs.unshift({
      id,
      date: new Date().toISOString(),
      w: low(m.w || ""),
      s: m.s || "",
      lvl: m.lvl || "",
      sid: c.id,
      star: false,
      dur: Math.round((Date.now() - t0) / 1000),
      type: blob.type,
    });
    c.recs.push(id);
    save();
    toast("🎙️ Ses kaydedildi" + (m.w ? ": " + m.w : ""));
    if (!child && view === "kayit") render();
  };
  REC.mr = mr;
  mr.start();
  recUI();
  say("");
  REC.timer = setTimeout(() => {
    try {
      mr.stop();
    } catch (e) {}
  }, 12000);
}
let _aud = null;

  try {
    const b = await idbGet("rec:" + id);

function calCard() {

function subjStats(logs) {
  const o = {};
  logs.forEach((l) => {

    const x = o[l.sub] || (o[l.sub] = { n: 0, ok: 0, t: new Set() });

  return o;

function suggestGoals() {
  const act = activeSounds();

    const l = S.profile.sounds[k].lvl || "kelime";
    const t =
      l === "izole"
        ? `/${k}/ sesini tek başına, model olmadan 10 denemede 8 doğru üretir.`
        : l === "hece"
          ? `/${k}/ sesini hecelerde (${sylls(k).cv.slice(0, 3).join(", ")}) %80 doğrulukla üretir.`
          : l === "kelime"
            ? `/${k}/ sesini kelime başında, ortasında ve sonunda %80 doğrulukla söyler.`
            : l === "cumle"
              ? `/${k}/ sesli kelimeleri kısa cümle içinde %80 doğrulukla söyler.`
              : `/${k}/ sesini serbest konuşmada çoğunlukla doğru kullanır.`;
    if (!S.profile.goals.some((g) => g.t === t))
      S.profile.goals.push({ id: uid(), t, st: "devam", date: new Date().toISOString() });
  });
  (S.profile.processes || []).slice(0, 2).forEach((p) => {
    const t = `${p.split(" (")[0]} sürecini minimal çift çalışmalarında %80 oranında ayırt eder ve doğru üretir.`;

  toast("Hedefler eklendi — düzenleyebilirsin");

function saveUnit(id) {
  const t = $("#eT").value.trim();
  if (!t) return toast("Başlık gerekli");
  let u = S.units.find((x) => x.id === id);
  if (!u) {
    u = { id: uid(), status: "bekliyor" };
    S.units.push(u);
  }
  u.title = t;
  u.icon = $("#eI").value.trim() || "📘";
  u.bookId = $("#eB").value;
  u.from = +$("#eF").value || 1;
  u.to = Math.max(+$("#eE").value || u.from, u.from);
  u.status = $("#eS").value;
  u.goal = $("#eG").value.trim();
  u.words = $("#eW")
    .value.split("\n")
    .map((l) => {
      const tk = l.trim().split(/\s+/);
      if (tk.length < 2) return null;
      return { e: tk[0], w: low(tk.slice(1).join(" ")), c: "" };
    })
    .filter(Boolean);
  u.seq = $("#eQ")
    .value.split("\n")
    .map((l) =>
      l
        .split("|")
        .map((p) => {
          const tk = p.trim().split(/\s+/);
          return { e: tk[0], t: tk.slice(1).join(" ") };
        })
        .filter((x) => x.e && x.t),
    )
    .filter((s) => s.length >= 2);
  u.sent = $("#eC")
    .value.split("\n")
    .map((s) => s.trim())
    .filter(Boolean);
  u.home = $("#eH").value.trim();
  save();
  closeModal();
  render();
  toast("Kaydedildi");
}
function delUnit(id) {

  save();
  closeModal();
  render();
}

async function exportData(withBooks) {
  busy("Yedek hazırlanıyor…");
  try {
    const media = {};
    if (withBooks) {
      for (const b of S.books) {
        const v = await idbGet(b.key);
        if (!v) continue;
        media[b.key] =
          b.type === "pdf" ? { pdf: await blobToData(new Blob([v], { type: "application/pdf" })) } : v;
      }
      try {
        for (const k of await idbKeys()) if (String(k).startsWith("ann:")) media[k] = await idbGet(k);
      } catch (e) {}
    }
    for (const w of S.works) {
      const d = await idbGet("work:" + w.id);
      if (d) media["work:" + w.id] = d;
    }
    for (const r of S.recs) {
      const b = await idbGet("rec:" + r.id);
      if (b) media["rec:" + r.id] = await blobToData(b);
    }
    try {
      for (const k of await idbKeys()) if (/^(card|photo|nphoto):/.test(k)) media[k] = await idbGet(k);
    } catch (e) {}
    offerShare(
      new Blob([JSON.stringify({ state: S, media })], { type: "application/json" }),
      `${fn(S.settings.student)}_${withBooks ? "Paket" : "Yedek"}_${dISO(Date.now())}.json`,
      "application/json",
    );
  } catch (e) {

  }
}
async function importData(f) {
  if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    const st = o.state || o;
    if (!st || !Array.isArray(st.sessions)) throw new Error("Geçersiz yedek");
    if (!confirm("Mevcut veriler yedektekiyle değiştirilsin mi?")) return;
    S = migrate(st);
    if (o.media)
      for (const [k, v] of Object.entries(o.media)) {
        busy("Aktarılıyor: " + k.split(":")[0]);
        let x = v;
        if (k.startsWith("rec:")) x = await dataToBlob(v);
        else if (v && v.pdf) x = await (await dataToBlob(v.pdf)).arrayBuffer();
        await idbSet(k, x);
      }
    busy(false);
    for (const k in PDFS) delete PDFS[k];
    save();
    render();
    toast("Yedek yüklendi");
  } catch (e) {
    toast("Yedek okunamadı: " + e.message);
  }
}
function resetAll() {
  if (!confirm("TÜM dersler, kayıtlar, kitaplar ve ayarlar silinecek. Emin misin?")) return;
  S = migrate({ v: 2 });
  save();
  try {
    _db && _db.close();
    _db = null;
    indexedDB.deleteDatabase("mete_dk");
  } catch (e) {}
  for (const k in PDFS) delete PDFS[k];
  render();
}

function offerShare(blob, name, type) {
  pend = new File([blob], name, { type });
  modal(
    `<h3>✅ Hazır</h3><p class="mut">${esc(name)} · ${fileSize(blob.size)}</p><div class="mbtns"><button class="btn" onclick="doShare()">📤 Paylaş (WhatsApp…)</button><button class="btn ghost" onclick="doDownload()">⬇️ İndir</button></div>`,
  );
}
async function doShare() {
  if (!pend) return;
  if (navigator.canShare && navigator.canShare({ files: [pend] })) {
    try {
      await navigator.share({ files: [pend] });
      closeModal();
    } catch (e) {
      if (e.name !== "AbortError") toast("Paylaşılamadı — İndir'i dene");
    }
  } else doDownload();
}
function doDownload() {
  if (!pend) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(pend);
  a.download = pend.name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 4000);
}
function copyText(t) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(() => toast("Metin kopyalandı — WhatsApp'a yapıştır"))
    .catch(() => prompt("Kopyala:", t));
}

function askRemote() {

  );
}

function makePlan(wk) {
  const W = weekData(wk);
  const act = activeSounds();
  const sounds = act.length ? act : Object.keys(W.snd);
  const items = [];
  const seen = new Set();
  const push = (x) => {
    if (x && x.w && !seen.has(x.w)) {
      seen.add(x.w);
      items.push({ w: x.w, e: x.e || emojiOf(x.w) });
    }
  };
  W.T.filter(
    (t) => t.r !== "+" && t.lvl !== "izole" && t.lvl !== "hece" && t.w && !t.w.includes(" "),
  ).forEach((t) => push({ w: t.w }));
  W.T.filter(
    (t) => t.r === "+" && t.w && !t.w.includes(" ") && t.lvl !== "izole" && t.lvl !== "hece",
  ).forEach((t) => push({ w: t.w }));
  sounds.forEach((s) => shuffle(poolFor(s, "karisik")).slice(0, 10).forEach(push));
  if (items.length < 10) shuffle(WB).slice(0, 10).forEach(push);
  const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
  const plan = days.map((d, i) => ({
    d,
    g: HOME_GAMES[i % HOME_GAMES.length],
    items: [0, 1, 2, 3, 4].map((k) => items[(i * 3 + k) % items.length]),
  }));
  wkObj(wk).plan = plan;
  save();
  return plan;
}

async function recsForReport(wk) {

  const out = [];
  for (const r of list.slice(0, 8)) {
    const b = await idbGet("rec:" + r.id);
    if (!b) continue;
    let first = null;
    if (r.w) {
      const older = S.recs
        .filter(
          (x) =>
            x.w === r.w && x.id !== r.id && new Date(x.date) < new Date(r.date) && weekKey(x.date) !== wk,
        )
        .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      if (older) {

        if (ob) first = { r: older, src: await blobToData(ob) };

    }
    out.push({ r, src: await blobToData(b), first });
  }
  return out;
}

function allInner() {
  const st = S.settings;

  const best = {},
    rank = { "+": 3, "~": 2, "-": 1 };
  S.sessions.forEach((s) =>
    Object.entries(sessData(s).words).forEach(([w, r]) => {
      if (!best[w] || rank[r] > rank[best[w]]) best[w] = r;
    }),

  const first = S.sessions.length ? S.sessions[S.sessions.length - 1].date : Date.now();
  return `<div class="rep"><div class="hd">${S.settings.photo ? `<span class="av" style="width:76px;height:76px"><img src="${S.settings.photo}" alt=""></span>` : '<div class="rb">🤖</div>'}<div><h1>${esc(st.student)} · Genel Gelişim Raporu</h1><p>${fmtD(first)} – ${fmtD(Date.now())} · ${esc(st.teacher)}</p></div></div>

function weekText(wk) {
  const st = S.settings,
    W = weekData(wk),
    o = wkObj(wk);
  const L = [
    `🤖 *${st.student}* · Haftalık Gelişim Raporu`,
    `📅 ${weekTitle(wk)}`,
    "",
    `📚 ${W.ss.length} ders${W.mins ? " · " + W.mins + " dk" : ""} · 🗣️ ${W.n} ses denemesi${W.n ? " · %" + pct(W.p, W.n) + " doğru" : ""}`,
  ];
  Object.entries(W.snd).forEach(([s, x]) => {
    const pv = W.prev[s];
    const d = pv && pv.n ? x.acc - pv.acc : null;
    L.push(`🎯 /${s}/: %${x.acc} doğru${d != null ? ` (${d >= 0 ? "▲" : "▼"}${Math.abs(d)})` : ""}`);
  });
  const ok = Object.entries(W.words)
    .filter((x) => x[1] === "+")
    .map((x) => x[0]);
  if (ok.length) L.push("", "✅ Doğru söyledikleri: " + ok.slice(0, 15).join(", "));
  const sj = subjStats(W.L);
  Object.entries(sj).forEach(([k, x]) => {
    if (SUBJ[k]) L.push(`${SUBJ[k].i} ${SUBJ[k].n}: ${x.n} etkinlik, %${pct(x.ok, x.n)} başarı`);
  });
  L.push(
    `🔤 Öğrendiği harfler: ${learned()
      .map((l) => l.toLocaleUpperCase("tr"))
      .join(" ")}`,
  );
  if (o.letter) L.push("", o.letter);
  if (o.focus) L.push("", "➡️ Gelecek hafta: " + o.focus);
  const plan = o.plan || makePlan(wk);
  L.push("", "🏠 Evde her gün 5 dk: " + plan[0].items.map((x) => x.e + " " + x.w).join(", ") + " …");
  L.push("", "— " + st.teacher);
  return L.join("\n");
}
function sessText(s) {
  const st = S.settings,
    d = sessData(s);
  const L = [
    `🤖 ${st.student} · Dil & Konuşma Dersi`,
    `📅 ${fmtD(s.date)}${d.mins ? " · " + d.mins + " dk" : ""}`,
  ];
  if (s.mood || s.att) L.push(`${s.mood || ""} ${s.att ? "Dikkat " + s.att + "/5" : ""}`.trim());
  Object.entries(d.snd).forEach(([k, o]) => L.push(`🎯 /${k}/: %${o.acc} doğru (${o.n} deneme)`));
  const ok = Object.entries(d.words)
    .filter((x) => x[1] === "+")
    .map((x) => x[0]);
  if (ok.length) L.push("✅ Doğru söyledikleri: " + ok.join(", "));
  if (s.pages) L.push("📄 Sayfalar: " + s.pages);
  if (s.letter) L.push("", s.letter);
  else if (s.notes) L.push("", "📝 " + s.notes);
  if (s.home) L.push("", "🏠 Evde: " + s.home);
  L.push("", "— " + st.teacher);
  return L.join("\n");
}

    const pdf = new window.jspdf.jsPDF("p", "pt", "a4");
    const pw = pdf.internal.pageSize.getWidth(),
      ph = pdf.internal.pageSize.getHeight();
    const sliceH = Math.floor((cv.width * ph) / pw);
    for (let y = 0, i = 0; y < cv.height; y += sliceH, i++) {
      const pc = document.createElement("canvas");
      pc.width = cv.width;
      pc.height = Math.min(sliceH, cv.height - y);

      g.fillStyle = "#fff";
      g.fillRect(0, 0, pc.width, pc.height);
      g.drawImage(cv, 0, y, cv.width, pc.height, 0, 0, cv.width, pc.height);
      if (i) pdf.addPage();
      pdf.addImage(pc.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, pw, (pc.height * pw) / cv.width);
    }
    offerShare(pdf.output("blob"), repName("pdf"), "application/pdf");

/* --- 1. Ses Robotu (tekrar) --- */
function drillItems() {
  const c = child.cfg,
    s = c.s,
    N = ROUNDS.drill;
  if (!s) return targetWords(N).map(wordItem);
  const S0 = SOUNDS[s];
  if (c.lvl === "izole")
    return Array.from({ length: N }, () => ({
      w: S0.iso,
      e: S0.e,
      say: S0.cue,
      lvl: "izole",
      base: "/" + s + "/",
    }));
  if (c.lvl === "hece") {
    const y = sylls(s);
    const list =
      c.pos === "son" ? y.vc : c.pos === "orta" ? y.vcv : c.pos === "bas" ? y.cv : y.cv.concat(y.vc, y.vcv);
    return shuffle(list.concat(list))
      .slice(0, N)
      .map((x) => ({ w: x, e: "", say: x, syl: true, lvl: "hece", base: x }));
  }
  if (c.lvl === "konusma")
    return targetWords(N).map((x) => ({
      w: x.w,
      e: x.e,
      say: "Bunu anlat bakalım: " + x.w,
      base: x.w,
      lvl: "konusma",
      talk: true,
    }));
  return targetWords(N).map(wordItem);
}
function actDrill() {
  const st = child.st || (child.st = { i: 0, items: drillItems(), res: [] });
  const N = st.items.length;
  if (st.i >= N) {
    const ok = st.res.filter((r) => r === "+").length;
    return finishAct(`Robot şarj oldu! ${ok}/${N} doğru! ⚡`);
  }
  const it = (st.item = st.items[st.i]);
  const s = child.cfg.s;
  if (!st.spoke) {
    st.spoke = 1;
    setTimeout(() => say(it.say), 300);
  }
  const track =
    Array.from(
      { length: N },
      (_, i) =>
        `<i class="${st.res[i] ? RES[st.res[i]].c : ""} ${i === st.i ? "cur" : ""}">${i === st.i ? "🤖" : st.res[i] === "+" ? "⚡" : ""}</i>`,
    ).join("") + '<i class="end">🔋</i>';
  const card = it.syl

/* --- 3. Kod Yolu --- */
const DIRS = {
  u: [-1, 0, "⬆️", "yukarı"],
  d: [1, 0, "⬇️", "aşağı"],
  l: [0, -1, "⬅️", "sola"],
  r: [0, 1, "➡️", "sağa"],
};
function bfs(N, R, T, W) {
  const seen = new Set([R + ""]);
  const q = [R];
  while (q.length) {
    const [a, b] = q.shift();
    if (a === T[0] && b === T[1]) return true;
    for (const d of Object.values(DIRS)) {
      const n = [a + d[0], b + d[1]],
        k = n + "";
      if (n[0] < 0 || n[1] < 0 || n[0] >= N || n[1] >= N || W.has(k) || seen.has(k)) continue;
      seen.add(k);
      q.push(n);
    }
  }
  return false;
}
function genRobot(r) {
  const N = 5;
  const want = Math.min(2 + r, 6);
  for (let k = 0; k < 300; k++) {
    const R = [ri(N), ri(N)],
      T = [ri(N), ri(N)];
    const d = Math.abs(R[0] - T[0]) + Math.abs(R[1] - T[1]);
    if (d < Math.max(2, want - 1) || d > want + 1) continue;
    const W = new Set();
    const nw = r < 2 ? 0 : Math.min(r, 3);
    let g = 0;
    while (W.size < nw && g++ < 50) {
      const k2 = [ri(N), ri(N)] + "";
      if (k2 !== R + "" && k2 !== T + "") W.add(k2);
    }
    if (bfs(N, R, T, W))
      return { N, R, T, W: [...W], pos: R.slice(), prog: [], run: false, step: -1, bad: -1 };
  }
  return { N, R: [2, 0], T: [2, 2], W: [], pos: [2, 0], prog: [], run: false, step: -1, bad: -1 };
}
function actRobot() {
  const st = child.st || (child.st = { r: 0, words: targetWords(ROUNDS.robot) });
  if (st.r >= ROUNDS.robot) return finishAct();
  if (!st.g) {
    st.g = genRobot(st.r);
    st.word = st.words[st.r];
    setTimeout(() => say("Robotu " + st.word.w + " yanına götür."), 350);
  }
  const g = st.g;
  let cells = "";
  for (let i = 0; i < g.N; i++)
    for (let j = 0; j < g.N; j++) {
      const k = i + "," + j;
      const isR = g.pos[0] === i && g.pos[1] === j,
        isT = g.T[0] === i && g.T[1] === j,
        isW = g.W.includes(k);
      cells += `<div class="rc ${isW ? "w" : ""} ${isT ? "t" : ""}">${isR ? "🤖" : isT ? esc(st.word.e) : isW ? "🧱" : ""}</div>`;
    }
  const prog =
    g.prog
      .map(
        (c, i) =>
          `<span class="pc ${g.step === i ? "on" : ""} ${g.bad === i ? "bad" : ""}">${DIRS[c][2]}</span>`,
      )
      .join("") || '<span class="mut">Oklara bas, robotun yolunu yaz 👇</span>';
  const dis = g.run ? "disabled" : "";
  const b = (d) => `<button onclick="rAdd('${d}')" ${dis}>${DIRS[d][2]}</button>`;
  kid(
    `<div class="kq"><button class="kbig" onclick="say('Robotu '+child.st.word.w+' yanına götür')">🔊</button>${dots(st.r, ROUNDS.robot)}</div><div class="rg">${cells}</div><div class="prog">${prog}</div><div class="pad"><span></span>${b("u")}<span></span>${b("l")}<button class="go" onclick="rRun()" ${g.run || !g.prog.length ? "disabled" : ""}>▶️</button>${b("r")}<span></span>${b("d")}<button class="del" onclick="rDel()" ${dis}>↩️</button></div>`,
  );
}
function rAdd(d) {
  const g = child.st.g;
  if (g.run || g.prog.length >= 14) return;
  g.prog.push(d);
  g.bad = -1;
  g.pos = g.R.slice();
  say(DIRS[d][3]);
  render();
}
function rDel() {
  const g = child.st.g;
  if (g.run) return;
  g.prog.pop();
  g.bad = -1;
  g.pos = g.R.slice();
  render();
}
function rRun() {
  const st = child.st,
    g = st.g;
  if (g.run || !g.prog.length) return;
  g.run = true;
  g.pos = g.R.slice();
  g.step = -1;
  g.bad = -1;
  render();
  let i = 0;
  const reset = (ms) =>
    setTimeout(() => {
      if (child && child.st === st) {
        g.pos = g.R.slice();
        g.step = -1;
        render();
      }
    }, ms);
  const tick = () => {
    if (!child || child.st !== st) return;
    if (i >= g.prog.length) {
      g.run = false;
      logIt("robot", st.word.w, false);
      say("Biraz daha kaldı. Yolu tamamlayalım.");
      render();
      reset(1200);
      return;
    }
    const c = g.prog[i];
    const np = [g.pos[0] + DIRS[c][0], g.pos[1] + DIRS[c][1]];
    g.step = i;
    if (np[0] < 0 || np[1] < 0 || np[0] >= g.N || np[1] >= g.N || g.W.includes(np + "")) {
      g.run = false;
      g.bad = i;
      logIt("robot", st.word.w, false);
      say("Hop! " + (i + 1) + ". adımda robot takıldı. Düzeltelim.");
      render();
      reset(1300);
      return;
    }
    g.pos = np;
    render();
    if (np[0] === g.T[0] && np[1] === g.T[1]) {
      g.run = false;
      logIt("robot", st.word.w, true);
      const it = wordItem(st.word);
      say("Robot " + st.word.w + " buldu! Sen de söyle: " + it.say);
      setTimeout(
        () =>
          trialPanel(it, () => {
            st.r++;
            st.g = null;
            render();
          }),
        800,
      );
      return;
    }
    i++;
    setTimeout(tick, 560);
  };
  setTimeout(tick, 420);
}

/* --- 4. Yapboz --- */
function pieces(e, n, bg) {
  const Z = 360,
    c = document.createElement("canvas");
  c.width = c.height = Z;
  const x = c.getContext("2d");
  x.fillStyle = bg;
  x.fillRect(0, 0, Z, Z);
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.font = `${Math.round(Z * 0.7)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.fillText(e, Z / 2, Z / 2 + Z * 0.04);
  const out = [],
    p = Z / n;
  for (let r = 0; r < n; r++)
    for (let q = 0; q < n; q++) {
      const d = document.createElement("canvas");
      d.width = d.height = p;
      d.getContext("2d").drawImage(c, q * p, r * p, p, p, 0, 0, p, p);
      out.push(d.toDataURL());
    }
  return out;
}
const PZBG = ["#e0e7ff", "#fce7f3", "#dcfce7", "#fef3c7", "#e0f2fe"];
function actPuzzle() {
  const st = child.st || (child.st = { r: 0, words: targetWords(ROUNDS.puzzle) });
  if (st.r >= ROUNDS.puzzle) return finishAct();
  if (!st.p) {
    const w = st.words[st.r];
    const n = st.r < 1 ? 2 : 3;
    const imgs = pieces(w.e, n, PZBG[st.r % PZBG.length]);
    let ord = shuffle(imgs.map((_, i) => i));
    while (ord.every((v, i) => v === i)) ord = shuffle(ord);
    st.p = { w, n, imgs, ord, sel: -1 };
    setTimeout(() => say("Yapboz zamanı! Parçaları yerine koy."), 350);
  }
  const p = st.p;
  kid(
    `<div class="kq"><div class="pzprev">${esc(p.w.e)}</div>${dots(st.r, ROUNDS.puzzle)}</div><div class="pz" style="grid-template-columns:repeat(${p.n},1fr)">${p.ord.map((v, i) => `<img src="${p.imgs[v]}" class="${p.sel === i ? "sel" : ""} ${v === i ? "ok" : ""}" onclick="pzTap(${i})" alt="">`).join("")}</div><p class="mut">İki parçaya dokun, yer değiştirsinler.</p>`,
  );
}
function pzTap(i) {
  const st = child.st,
    p = st.p;
  if (!p || p.done) return;
  if (p.sel < 0) {
    p.sel = i;
    render();
    return;
  }
  if (p.sel === i) {
    p.sel = -1;
    render();
    return;
  }
  const a = p.sel;
  [p.ord[a], p.ord[i]] = [p.ord[i], p.ord[a]];
  p.sel = -1;
  render();
  if (p.ord.every((v, k) => v === k)) {
    p.done = true;
    logIt("puzzle", p.w.w, true);
    const it = wordItem(p.w);
    say("Tamamlandı! Sen de söyle: " + it.say);
    setTimeout(
      () =>
        trialPanel(it, () => {
          st.r++;
          st.p = null;
          render();
        }),
      900,
    );
  }
}

function makePaper(letter) {
  const W = 1600,
    H = 1000;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, W, H);
  if (letter) {
    const base = H * 0.78,
      top = H * 0.18,
      mid = (base + top) / 2 + 40;
    g.strokeStyle = "#93c5fd";
    g.lineWidth = 3;
    [top, base].forEach((y) => {
      g.beginPath();
      g.moveTo(40, y);
      g.lineTo(W - 40, y);
      g.stroke();
    });
    g.setLineDash([14, 12]);
    g.strokeStyle = "#fda4af";
    g.beginPath();
    g.moveTo(40, mid);
    g.lineTo(W - 40, mid);
    g.stroke();
    const txt = letter.toLocaleUpperCase("tr") + " " + letter;
    g.font = `bold ${Math.round(base - top + 40)}px "Comic Sans MS","Chalkboard SE","Segoe Print",Arial,sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "alphabetic";
    g.setLineDash([18, 16]);
    g.lineWidth = 7;
    g.strokeStyle = "#94a3b8";
    g.strokeText(txt, W / 2, base);
    g.setLineDash([]);
    const s = SOUNDS[letter];
    if (s) {
      g.font = '110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = "left";
      g.fillText(s.e, 48, 150);
    }
  } else {
    g.strokeStyle = "#e2e8f0";
    g.lineWidth = 2;
    for (let y = 120; y < H; y += 110) {
      g.beginPath();
      g.moveTo(40, y);
      g.lineTo(W - 40, y);
      g.stroke();
    }
  }
  return c.toDataURL("image/jpeg", 0.9);
}

    i.onload = () => r(i.naturalWidth / i.naturalHeight || 1.6);
    i.onerror = () => r(1.6);
    i.src = src;
  });
}

function bNote(t) {

function bLayout() {
  const st = $("#bstage"),
    pg = $("#bpage");
  if (!st || !pg) return;
  const aw = st.clientWidth - 16,
    ah = st.clientHeight - 16;
  let w = aw,
    h = w / B.aspect;
  if (h > ah) {
    h = ah;
    w = h * B.aspect;
  }
  pg.style.width = w + "px";
  pg.style.height = h + "px";
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  B.W = w;
  B.H = h;
  B.cv.width = Math.round(w * dpr);
  B.cv.height = Math.round(h * dpr);
  B.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bRedraw();
}
window.addEventListener("resize", () => {
  if (B.on) bLayout();
});
function bSet(k, v) {
  B[k] = v;
  if (k === "color" && B.mode === "er") B.mode = "pen";
  bUI();
  bLayout();
}
function strokeStyle(g, s) {
  const w = Math.max(1, s.w * B.W);
  g.lineCap = "round";
  g.lineJoin = "round";
  g.lineWidth = s.m === "hl" ? w * 3.2 : s.m === "er" ? w * 3 : w;
  g.globalCompositeOperation = s.m === "er" ? "destination-out" : "source-over";
  g.globalAlpha = s.m === "hl" ? 0.32 : 1;
  g.strokeStyle = s.c;
  g.fillStyle = s.c;
}
function drawStroke(g, s, W, H) {
  const p = s.pts;
  if (!p.length) return;
  strokeStyle(g, s);
  if (W !== B.W) g.lineWidth = (g.lineWidth * W) / B.W;
  if (p.length === 1) {
    g.beginPath();
    g.arc(p[0][0] * W, p[0][1] * H, g.lineWidth / 2, 0, 7);
    g.fill();
    return;
  }
  g.beginPath();
  g.moveTo(p[0][0] * W, p[0][1] * H);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i + 1][0]) / 2,
      my = (p[i][1] + p[i + 1][1]) / 2;
    g.quadraticCurveTo(p[i][0] * W, p[i][1] * H, mx * W, my * H);
  }
  const l = p[p.length - 1];
  g.lineTo(l[0] * W, l[1] * H);
  g.stroke();
}
function bRedraw() {
  const g = B.ctx;
  if (!g) return;
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, B.cv.width, B.cv.height);
  g.restore();
  B.strokes.forEach((s) => {
    g.save();
    drawStroke(g, s, B.W, B.H);
    g.restore();
  });
}
function bindDraw(cv) {
  const pt = (e) => {
    const r = cv.getBoundingClientRect();
    return [
      Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
    ];
  };
  cv.addEventListener("pointerdown", (e) => {
    if (S.settings.penOnly && e.pointerType === "touch" && !B.guest) return;
    e.preventDefault();
    try {
      cv.setPointerCapture(e.pointerId);
    } catch (x) {}
    const s = { id: uid(), c: B.color, w: PEN_SIZES[B.size], m: B.mode, pts: [pt(e)] };
    B.cur = s;
    B.strokes.push(s);
    B.redo = [];
    bRedraw();
  });
  cv.addEventListener("pointermove", (e) => {
    const s = B.cur;
    if (!s) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach((ev) => s.pts.push(pt(ev)));
    const g = B.ctx;
    g.save();
    const n = s.pts.length;
    drawStroke(g, { c: s.c, w: s.w, m: s.m, pts: s.pts.slice(Math.max(0, n - evs.length - 2)) }, B.W, B.H);
    g.restore();
    const now = Date.now();
    if (now - B.lastSend > 70) {
      B.lastSend = now;
      bSend({ t: "s", s });
    }
  });
  const end = (e) => {
    const s = B.cur;
    if (!s) return;
    B.cur = null;
    if (s.m === "hl") bRedraw();
    bSend({ t: "s", s });
    bPersist();
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("lostpointercapture", end);
}
function bPersist() {
  if (!B.key || B.guest) return;
  clearTimeout(B._ps);
  B._ps = setTimeout(() => {
    idbSet(
      B.key,
      B.strokes.map((s) => ({ id: s.id, c: s.c, w: s.w, m: s.m, pts: s.pts })),
    ).catch(() => {});
  }, 400);
}
function bUndo() {
  const s = B.strokes.pop();
  if (!s) return;
  B.redo.push(s);
  bRedraw();
  bSend({ t: "undo", id: s.id });
  bPersist();
}
function bClear() {
  if (!B.strokes.length || !confirm("Sayfadaki tüm yazılar silinsin mi?")) return;

}

async function bComposite(maxW) {
  const W = Math.min(maxW || 1400, Math.round(1400)),
    H = Math.round(W / B.aspect);
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, W, H);
  if (B.bg) {
    const i = new Image();
    await new Promise((r) => {
      i.onload = i.onerror = r;
      i.src = B.bg;
    });
    g.drawImage(i, 0, 0, W, H);
  }
  const ink = document.createElement("canvas");
  ink.width = W;
  ink.height = H;
  const ig = ink.getContext("2d");
  B.strokes.forEach((s) => {
    ig.save();
    drawStroke(ig, s, W, H);
    ig.restore();
  });
  g.drawImage(ink, 0, 0);
  return c;
}

/* ---- Peer bağlantısı ---- */
const PEERJS = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
  QRJS = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
function bInitMsg() {
  return { t: "init", bg: B.bg, aspect: B.aspect, title: B.title, strokes: B.strokes };
}
function bBroadcastInit() {
  if (!B.peer || B.guest) return;
  B.conns.forEach((c) => {
    try {
      c.open && c.send(bInitMsg());
    } catch (e) {}
  });
}
function bSend(m, except) {
  if (B.guest) {
    try {
      B.host && B.host.open && B.host.send(m);
    } catch (e) {}
    return;
  }
  B.conns.forEach((c) => {
    if (c !== except) {
      try {
        c.open && c.send(m);
      } catch (e) {}
    }
  });
}
function bOnData(d, from) {
  if (!d || !d.t) return;
  if (d.t === "init") {
    B.bg = d.bg;
    B.aspect = d.aspect || 1.6;
    B.title = d.title;
    B.strokes = d.strokes || [];
    bUI();
    bLayout();
    return;
  }
  if (d.t === "s") {
    const i = B.strokes.findIndex((x) => x.id === d.s.id);
    if (i >= 0) B.strokes[i] = d.s;
    else B.strokes.push(d.s);
    bRedraw();
    if (!B.guest) {
      bSend(d, from);
      bPersist();
    }
  } else if (d.t === "undo") {
    B.strokes = B.strokes.filter((x) => x.id !== d.id);
    bRedraw();
    if (!B.guest) {
      bSend(d, from);
      bPersist();
    }
  } else if (d.t === "clear") {
    B.strokes = [];
    bRedraw();
    if (!B.guest) {
      bSend(d, from);
      bPersist();
    }
  }
}
function joinUrl(code) {
  return location.origin + location.pathname + "?tahta=" + code;
}

function startHost(code) {
  return new Promise((res, rej) => {
    let p;
    try {
      p = new Peer("metedk-" + code, { debug: 0 });
    } catch (e) {
      return rej(e);
    }
    B.peer = p;
    B.code = code;
    B.conns = [];
    p.on("open", () => {
      busy(false);
      bUI();
      bLayout();
      showShare();
      res();
    });
    p.on("connection", (c) => {
      c.on("open", () => {
        B.conns.push(c);
        try {
          c.send(bInitMsg());
        } catch (e) {}
        bUI();
        bLayout();
        closeModal();
        bNote("📱 Cihaz bağlandı! Yazdıklarınız eşleniyor.");
      });
      c.on("data", (d) => bOnData(d, c));
      c.on("close", () => {
        B.conns = B.conns.filter((x) => x !== c);
        if (B.on) {
          bUI();
          bLayout();
        }
      });
    });
    p.on("error", (e) => {
      if (e.type === "unavailable-id") {
        try {
          p.destroy();
        } catch (x) {}
        B.peer = null;
        startHost(String(1000 + ri(9000))).then(res, rej);
      } else {
        busy(false);
        toast("Bağlantı hatası: " + e.type);
      }
    });
    p.on("disconnected", () => {
      setTimeout(() => {
        try {
          p.reconnect();
        } catch (x) {}
      }, 1500);
    });
  });
}
async function showShare() {

let AC = null;
function ac() {
  if (!AC)
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, d, at, vol) {
  const a = ac();
  if (!a) return;
  const o = a.createOscillator(),
    g = a.createGain();
  o.type = "triangle";
  o.frequency.value = f;
  const t0 = a.currentTime + (at || 0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.35, t0 + 0.02);
  g.gain.setValueAtTime(vol || 0.35, t0 + Math.max(0.03, d - 0.05));
  g.gain.linearRampToValueAtTime(0, t0 + d);
  o.connect(g).connect(a.destination);
  o.start(t0);
  o.stop(t0 + d + 0.02);
}
function clap(at, vol) {
  const a = ac();
  if (!a) return;
  const n = a.createBufferSource(),
    b = a.createBuffer(1, a.sampleRate * 0.12, a.sampleRate),
    d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  n.buffer = b;
  const g = a.createGain();
  g.gain.value = vol || 0.8;
  n.connect(g).connect(a.destination);
  n.start(a.currentTime + (at || 0));
}

/* ---- Çocuk ekranı: dersler ---- */
function subTopics(s) {
  return Object.values(TOP).filter((t) => t.s === s);
}
function hubHTML() {
  return `<div class="khello"><span class="kro">${avatarHTML(64)}</span><span><b>Dersler</b><small>Hangisini oynayalım?</small></span></div><div class="ktiles">${Object.entries(
    SUBJ,
  )
    .map(
      ([k, v]) =>
        `<button class="ktile sub" style="--c:${v.c}" onclick="openSub('${k}')"><span class="kti">${v.i}</span><span class="ktn">${v.n}</span></button>`,
    )
    .join("")}</div>`;
}
function openSub(k) {
  if (k === "mr") return openMinik();
  if (child.act === "hub") child.fromHub = true;
  child.act = "sub";
  child.sub = k;
  child.st = null;
  render();
}
function subHTML(k) {
  const v = SUBJ[k];
  const stats = topicStats();
  return `<div class="khello" style="border-bottom:6px solid ${v.c}"><span class="kro">${v.i}</span><span><b>${v.n}</b><small>${
    k === "tr"
      ? "Öğrendiğimiz harfler: " +
        learned()
          .map((l) => l.toLocaleUpperCase("tr"))
          .join(" ")
      : "Bir oyun seç"
  }</small></span></div><div class="ktiles">${subTopics(k)
    .map((t) => {
      const s = stats[t.k];
      return `<button class="ktile" onclick="startTopic('${t.k}')"><span class="kti">${t.i}</span><span class="ktn">${esc(t.n)}</span>${s && s.n ? `<em style="background:${v.c}">%${pct(s.ok, s.n)}</em>` : ""}</button>`;
    })
    .join("")}</div>`;
}
function topicStats() {
  const o = {};
  allLogs().forEach((l) => {
    if (l.a !== "q") return;
    const x = o[l.w] || (o[l.w] = { n: 0, ok: 0 });
    x.n++;
    if (l.ok) x.ok++;
  });
  return o;
}
function startTopic(k) {
  const t = TOP[k];
  if (!t) return;
  if (t.type === "write") {
    child.topic = k;
    return openLetterBoard(true, learned());
  }
  if (t.type === "draw") {

/* Sudoku 4x4 */
function genSudoku() {
  let g = [
    [0, 1, 2, 3],
    [2, 3, 0, 1],
    [1, 0, 3, 2],
    [3, 2, 1, 0],
  ];
  if (ri(2)) g = [g[1], g[0], g[2], g[3]];
  if (ri(2)) g = [g[0], g[1], g[3], g[2]];
  if (ri(2)) g = g.map((r) => [r[1], r[0], r[2], r[3]]);
  if (ri(2)) g = g.map((r) => [r[0], r[1], r[3], r[2]]);
  const sym = pickN(["🍎", "🍌", "🍇", "🍊", "🐱", "🐶", "🚗", "⭐"], 4);
  const blanks = new Set();
  while (blanks.size < 5) blanks.add(ri(16));
  return {
    sol: g,
    sym,
    cur: g.map((r, i) => r.map((v, j) => (blanks.has(i * 4 + j) ? -1 : v))),
    fixed: g.map((r, i) => r.map((v, j) => !blanks.has(i * 4 + j))),
    sel: -1,
    err: 0,
  };
}
function actSudoku(t) {
  const st = child.st || (child.st = genSudoku());
  const done = st.cur.every((r, i) => r.every((v, j) => v === st.sol[i][j]));
  if (done && !st.fin) {
    st.fin = 1;
    qLog(st.err <= 1);
    setTimeout(() => finishTopic("Sudoku ustası! 🧠"), 500);
  }
  if (!st.spoke) {
    st.spoke = 1;
    say("Her satırda ve her sütunda her resimden bir tane olmalı. Boş kareye dokun, resmi seç.");
  }
  kid(
    `<div class="sdk">${st.cur.map((r, i) => r.map((v, j) => `<button class="sc ${st.fixed[i][j] ? "fx" : ""} ${st.sel === i * 4 + j ? "sel" : ""} ${(j === 1 ? "br " : "") + (i === 1 ? "bb" : "")}" onclick="sdSel(${i * 4 + j})">${v >= 0 ? st.sym[v] : ""}</button>`).join("")).join("")}</div><div class="kopts">${st.sym.map((e, k) => `<button class="kcard sm" onclick="sdPut(${k})">${e}</button>`).join("")}</div>`,
  );
}
function sdSel(n) {
  const st = child.st;
  if (st.fixed[(n / 4) | 0][n % 4]) return;
  st.sel = n;
  render();
}
function sdPut(k) {
  const st = child.st;
  if (st.sel < 0) return say("Önce boş bir kareye dokun.");
  const i = (st.sel / 4) | 0,
    j = st.sel % 4;
  if (st.sol[i][j] === k) {
    st.cur[i][j] = k;
    st.sel = -1;
    say("Doğru!");
    render();
  } else {
    st.err++;
    say("Bu satırda ya da sütunda zaten var. Bir daha düşün.");
  }
}

const richness = (s) =>
  (s.trials || []).length + (s.log || []).length + (s.works || []).length + (s.recs || []).length;
function unionBy(a, b, key, pick) {
  const m = new Map();
  (a || []).forEach((x) => m.set(key(x), x));
  (b || []).forEach((x) => {
    const k = key(x);
    if (!m.has(k)) m.set(k, x);
    else if (pick) m.set(k, pick(m.get(k), x));
  });
  return [...m.values()];
}
function mergeState(R) {
  R = migrate(R);

  const sess = unionBy(
    S.sessions,
    R.sessions,
    (x) => x.id,
    (a, b) => (richness(b) > richness(a) ? b : a),
  ).sort((a, b) => new Date(b.date) - new Date(a.date));
  let cur = S.current;
  const ended = new Set(sess.map((s) => s.id));
  if (cur && ended.has(cur.id)) cur = null;
  if (R.current && !ended.has(R.current.id)) {
    if (!cur) cur = R.current;
    else if (cur.id === R.current.id) {
      if (richness(R.current) > richness(cur)) cur = R.current;
    } else {
      const old = new Date(R.current.date) < new Date(cur.date) ? R.current : cur;
      const keep = old === cur ? R.current : cur;
      old.end = old.end || Date.now();
      sess.unshift(old);
      cur = keep;
    }
  }
  S.sessions = sess;
  S.current = cur;
  S.units = unionBy(
    S.units,
    R.units,
    (x) => x.id,
    (a, b) => ((b.words || []).length > (a.words || []).length ? b : a),
  );
  S.books = unionBy(S.books, R.books, (x) => x.id);
  S.works = unionBy(S.works, R.works, (x) => x.id).sort((a, b) => new Date(b.date) - new Date(a.date));
  S.recs = unionBy(
    S.recs,
    R.recs,
    (x) => x.id,
    (a, b) => Object.assign({}, a, { star: a.star || b.star }),
  ).sort((a, b) => new Date(b.date) - new Date(a.date));
  S.customWords = unionBy(S.customWords, R.customWords, (x) => x.w);
  const wl = (o) =>
    ((o && o.letter) || "").length + ((o && o.note) || "").length + ((o && o.focus) || "").length;
  Object.entries(R.weeks || {}).forEach(([k, o]) => {
    const l = S.weeks[k];
    if (!l || wl(o) > wl(l) || (!l.plan && o.plan))
      S.weeks[k] = Object.assign({}, l || {}, o, { plan: (l && l.plan) || o.plan });
  });
  S.stars = Math.max(S.stars, R.stars || 0);
  S.parts = Math.min(PARTS.length, Math.floor(S.stars / STAR_PER));
  if (newer) {
    const keepPair = S.settings.pair;
    S.settings = Object.assign({}, S.settings, R.settings, { pair: keepPair || R.settings.pair });
    S.profile = R.profile;
    S.cfg = R.cfg;
    S.schedule = R.schedule;
    if (!S.settings.photo && R.settings.photo) S.settings.photo = R.settings.photo;
  } else if (!S.settings.photo && R.settings.photo) S.settings.photo = R.settings.photo;
  for (const k in PDFS) delete PDFS[k];
  save();
}

      render();
    } else if (d.a.startsWith("sub:")) openSub(d.a.slice(4));
    else if (d.a.startsWith("t:")) startTopic(d.a.slice(2));
    else startAct(d.a);
    return;
  }
  if (c === "rate") {
    if ($("#sp").classList.contains("on")) return spRate(d.r);
    if (child && child.act === "drill") return drillRate(d.r);
    if (child && child.act === "q" && TOP[child.topic] && TOP[child.topic].type === "move")
      return moveDone(d.r !== "-");
    return;
  }
  if (c === "rec") {
    return recCur();
  }
  if (c === "say") {
    if (child && child.act === "q") return qReplay();
    const b = document.querySelector(".kid .kbig,.kid .dcard");
    if (b) b.click();
    return;
  }
  if (c === "home") {
    $("#sp").classList.remove("on");
    if (B.on) closeBoard();
    if (child) {
      if (child.act === "q") {
        child.act = "sub";
        child.st = null;
        render();
      } else childBack();
    }
    return;
  }
  if (c === "mute") {
    toggleMute();
    return;
  }
  if (c === "cfg") {
    Object.assign(S.cfg, d.cfg);
    save();
    if (child) {
      child.cfg = curCfg();
      child.st = null;
      render();
    }
    return;
  }
  if (c === "end") {
    if (B.on) closeBoard();
    child = null;
    $("#sp").classList.remove("on");
    if (S.current) {
      endSession();
    }
    setTimeout(syncSend, 300);
    return;
  }
}
/* --- Telefon (kumanda) tarafı --- */
async function phoneMode(code) {
  code = String(code || "").replace(/\D/g, "");
  if (code.length < 4) return toast("Tahtadaki 4 haneli kodu gir");
  RM.role = "phone";
  RM.code = code;
  S.settings.rmCode = code;
  save();
  try {
    await loadJs(PEERJS);
  } catch (e) {
    return toast(e.message);
  }
  rmConnect();
  rmUI();
}
function rmConnect() {
  if (RM.role !== "phone") return;
  const go = () => {
    const c = RM.peer.connect("metedkr-" + RM.code, { reliable: true });
    bindConn(c);
  };
  if (RM.peer && !RM.peer.destroyed && RM.peer.open) return go();
  try {
    RM.peer && RM.peer.destroy();
  } catch (e) {}
  const p = new Peer({ debug: 0 });
  RM.peer = p;
  p.on("open", go);
  p.on("error", (e) => {
    rmNote(
      e.type === "peer-unavailable"
        ? "Tahta bulunamadı — tahtada 📺 Tahta modu açık mı?"
        : "Bağlantı hatası: " + e.type,
    );
    rmUI();
  });
}
function rmSend(m) {
  if (RM.conn && RM.conn.open) RM.conn.send(m);
  else toast("Tahtaya bağlı değil");
}
const rmCmd = (c, x) => rmSend(Object.assign({ t: "cmd", c }, x || {}));
function rmClose() {
  RM.role = null;
  try {
    RM.conn && RM.conn.close();
  } catch (e) {}
  try {
    RM.peer && RM.peer.destroy();
  } catch (e) {}
  RM.peer = null;
  RM.conn = null;
  RM.open = false;
  rmUI();
  try {
    history.replaceState(null, "", location.pathname);
  } catch (e) {}
}
function rmUI() {
  let el = $("#remote");
  if (RM.role !== "phone") {
    if (el) el.remove();
    return;
  }
  if (!el) {
    el = document.createElement("div");
    el.id = "remote";
    document.body.appendChild(el);
  }
  const s = RM.status;
  const acts = S.schedule
    .concat(["hub"])
    .map((a) => {
      const x = a === "hub" ? { i: "📚", n: "Dersler" } : actInfo(a);
      return `<button onclick="rmCmd('act',{a:'${a}'})">${x.i} ${esc(x.n)}</button>`;
    })
    .join("");
  el.className = RM.fold ? "fold" : "";
  el.innerHTML = `<div class="rmh" onclick="RM.fold=!RM.fold;rmUI()"><span class="dot ${RM.open ? "ok" : ""}"></span><b>📺 Kumanda ${RM.open ? "· bağlı" : "· bağlanıyor…"}</b><span class="mut" id="rmNote">${esc(RM.note || "")}</span><span>${RM.fold ? "▲" : "▼"}</span></div>
 ${
   RM.fold
     ? ""
     : `<div class="rmnow">${s ? `<div><small>Tahtada</small><b>${esc(s.title)}</b></div>${s.item ? `<div class="rmit">${esc(s.item.e)} ${esc(s.item.w)}</div>` : ""}<div class="kst">⭐ ${s.stars}</div>` : '<span class="mut">Tahtadan bilgi bekleniyor…</span>'}</div>
 <div class="cnt"><button class="g" onclick="rmCmd('rate',{r:'+'})">✅ Doğru</button><button class="y" onclick="rmCmd('rate',{r:'~'})">🟡 İpucu</button><button class="n" onclick="rmCmd('rate',{r:'-'})">⏳ Henüz</button></div>
 <div class="rmrow"><button onclick="rmCmd('say')">🔊 Tekrar</button><button onclick="rmCmd('home')">🏠 Geri</button><button onclick="rmCmd('mute')">${s && s.mute ? "🔇 Ses kapalı" : "🔊 Ses açık"}</button><button onclick="rmCmd('rec')">🎙️ Kayıt</button><button onclick="syncSend();rmNote('🔄 Eşitleniyor…')">🔄 Eşitle</button></div>
 <div class="rmacts">${acts}</div><div class="rmrow"><button class="end" onclick="if(confirm('Ders bitirilsin mi?'))rmCmd('end')">🏁 Dersi bitir</button><button onclick="rmClose()">✖ Kumandayı kapat</button></div>`
 }`;
}
function actInfo(a) {
  if (a.startsWith("sub:")) {
    const v = SUBJ[a.slice(4)];
    return v ? { i: v.i, n: v.n } : { i: "❓", n: a };
  }
  return ACTS[a] ? { i: ACTS[a].i, n: ACTS[a].n } : { i: "❓", n: a };
}
function toggleMute() {
  S.settings.sound = !S.settings.sound;
  save();
  if (!S.settings.sound)
    try {
      speechSynthesis.cancel();
    } catch (e) {}
  toast(S.settings.sound ? "🔊 Ses açık" : "🔇 Ses kapalı");
  if (child) render();
  else if (!B.on) render();
  pushStatus(true);
}
