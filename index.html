const GFONT = '"Comic Sans MS","Chalkboard SE","Segoe Print",Nunito,Arial,sans-serif';
const PATTERNS = [
  ["Dik çizgi", "|"],
  ["Yatay çizgi", "—"],
  ["Eğik çizgi", "/"],
  ["Ters eğik", "\\"],
  ["Dalga", "〰"],
  ["Zikzak", "⋀"],
  ["Halka", "ℓ"],
  ["Kemer", "∩"],
  ["Çanak", "∪"],
  ["Daire", "○"],
];
function guideRows(g, W, H, rows, top) {
  const out = [];
  const rh = (H - top - 20) / rows;
  for (let r = 0; r < rows; r++) {
    const y0 = top + r * rh;
    const hi = y0 + rh * 0.16,
      base = y0 + rh * 0.84,
      mid = (hi + base) / 2;
    g.setLineDash([]);
    g.lineWidth = 2;
    g.strokeStyle = "#93c5fd";
    [hi, base].forEach((y) => {
      g.beginPath();
      g.moveTo(30, y);
      g.lineTo(W - 30, y);
      g.stroke();
    });
    g.setLineDash([12, 10]);
    g.strokeStyle = "#fda4af";
    g.beginPath();
    g.moveTo(30, mid);
    g.lineTo(W - 30, mid);
    g.stroke();
    g.setLineDash([]);
    out.push({ hi, base, mid, h: base - hi });
  }
  return out;
}
function patPath(g, p, x, hi, base, w) {
  const m = (hi + base) / 2,
    h = base - hi;
  g.beginPath();
  switch (p) {
    case 0:
      g.moveTo(x + w / 2, hi);
      g.lineTo(x + w / 2, base);
      break;
    case 1:
      g.moveTo(x + 4, m);
      g.lineTo(x + w - 4, m);
      break;
    case 2:
      g.moveTo(x + 4, base);
      g.lineTo(x + w - 4, hi);
      break;
    case 3:
      g.moveTo(x + 4, hi);
      g.lineTo(x + w - 4, base);
      break;
    case 4:
      g.moveTo(x, m);
      g.bezierCurveTo(x + w * 0.25, hi, x + w * 0.25, hi, x + w * 0.5, m);
      g.bezierCurveTo(x + w * 0.75, base, x + w * 0.75, base, x + w, m);
      break;
    case 5:
      g.moveTo(x, base);
      g.lineTo(x + w / 2, hi);
      g.lineTo(x + w, base);
      break;
    case 6:
      g.moveTo(x, base);
      g.bezierCurveTo(x + w * 0.9, base, x + w * 0.9, hi, x + w * 0.5, hi);
      g.bezierCurveTo(x + w * 0.1, hi, x + w * 0.1, base, x + w, base);
      break;
    case 7:
      g.moveTo(x + 4, base);
      g.bezierCurveTo(x + 4, hi - h * 0.1, x + w - 4, hi - h * 0.1, x + w - 4, base);
      break;
    case 8:
      g.moveTo(x + 4, hi);
      g.bezierCurveTo(x + 4, base + h * 0.1, x + w - 4, base + h * 0.1, x + w - 4, hi);
      break;
    case 9:
      g.arc(x + w / 2, m, Math.min(w, h) / 2.4, 0, Math.PI * 2);
      break;
  }
  g.stroke();
}
function drawGuide(g, W, H, spec, top, rows) {
  rows = rows || 3;
  const R = guideRows(g, W, H, rows, top);
  if (spec.t === "lines" || spec.t === "blank") return;
  if (spec.t === "pattern") {
    R.forEach((r, ri0) => {
      const w = r.h * 0.75;
      let x = 40;
      let first = true;
      while (x + w < W - 40) {
        g.lineWidth = first ? 8 : 6;
        g.strokeStyle = first ? "#64748b" : ri0 === rows - 1 ? "rgba(148,163,184,.0)" : "#94a3b8";
        g.setLineDash(first ? [] : [10, 10]);
        if (ri0 < rows - 1 || first) patPath(g, spec.p, x, r.hi, r.base, w);
        first = false;
        x += w + (spec.p === 1 ? 0 : r.h * 0.15);
      }
      g.setLineDash([]);
    });
    return;
  }
  const txt = String(spec.text);
  R.forEach((r, ri0) => {
    const fs = Math.round(r.h * 1.32);
    g.font = `bold ${fs}px ${GFONT}`;
    g.textBaseline = "alphabetic";
    g.textAlign = "left";
    const tw = g.measureText(txt).width;
    const gap = Math.max(40, r.h * 0.45);
    let x = 44;
    let k = 0;
    while (x + tw < W - 30) {
      const model = ri0 === 0 && k === 0;
      if (model) {
        g.fillStyle = "#cbd5e1";
        g.fillText(txt, x, r.base);
        g.fillStyle = "#16a34a";
        g.beginPath();
        g.arc(x + 6, r.hi + 6, 9, 0, 7);
        g.fill();
      } else if (ri0 < rows - 1) {
        g.setLineDash([14, 12]);
        g.lineWidth = 5;
        g.strokeStyle = ri0 === 0 ? "#94a3b8" : "#cbd5e1";
        g.strokeText(txt, x, r.base);
        g.setLineDash([]);
      }
      x += tw + gap;
      k++;
      if (ri0 === rows - 1) break;
    }
  });
}
function makeGuide(spec) {
  const W = 1600,
    H = 1000;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, W, H);
  if (spec.t === "kareli") {
    g.strokeStyle = "#cbd5e1";
    g.lineWidth = 1.5;
    for (let x = 0; x < W; x += 50) {
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x, H);
      g.stroke();
    }
    for (let y = 0; y < H; y += 50) {
      g.beginPath();
      g.moveTo(0, y);
      g.lineTo(W, y);
      g.stroke();
    }
    return c.toDataURL("image/jpeg", 0.9);
  }
  if (spec.e) {
    g.font = '90px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textBaseline = "top";
    g.fillText(spec.e, 30, 14);
  }
  drawGuide(g, W, H, spec, spec.e ? 120 : 30, 3);
  return c.toDataURL("image/jpeg", 0.9);
}
function guideTitle(spec) {
  return spec.t === "pattern"
    ? "Çizgi: " + PATTERNS[spec.p][0]
    : spec.t === "kareli"
      ? "Kareli kâğıt"
      : spec.t === "lines"
        ? "Çizgili kâğıt"
        : spec.t === "dikte"
          ? "Dikte"
          : "Yaz: " + spec.text;
}
function guideKind(spec) {
  if (spec.t === "pattern") return "cizgi";
  if (spec.t === "kareli") return "matematik";
  if (spec.kind) return spec.kind;
  if (/^\d+$/.test(spec.text || "")) return "rakam";
  return (spec.text || "").length <= 2 ? "harf" : "kelime";
}
function openGuide(spec, o) {
  o = o || {};
  openBoard(
    Object.assign({ bg: makeGuide(spec), title: guideTitle(spec), kind: guideKind(spec), guide: spec }, o),
  );
  if (o.fromChild)
    say(
      spec.t === "pattern"
        ? "Noktaların üstünden git. Yeşil noktadan başla."
        : "Haydi yazalım! Önce gri olanın üstünden geç, sonra noktalılar.",
    );
}

function actOrder(t) {
  const st = child.st || (child.st = { r: 0 });
  if (st.r >= t.rounds) return finishTopic();
  if (!st.nums) {
    const M = Math.min(mmax(), 20);
    const s = new Set();
    while (s.size < 4) s.add(ri(M + 1));
    st.nums = shuffle([...s]);
    st.sorted = [...s].sort((a, b) => a - b);
    st.placed = [];
    st.first = true;
    setTimeout(() => say("Sayıları küçükten büyüğe sırala."), 300);
  }
  kid(
    `<div class="kq"><button class="kbig" onclick="say('Küçükten büyüğe sırala')">🔊</button>${dots(st.r, t.rounds)}</div><div class="slots">${st.sorted.map((_, i) => `<div class="slot ${st.placed[i] != null ? "f" : ""}" style="font-weight:900;color:#3730a3">${st.placed[i] != null ? st.placed[i] : ""}</div>`).join("")}</div><div class="kopts">${st.nums.map((n, k) => (st.placed.includes(n) ? "" : `<button class="kcard ${st.bad === k ? "shake" : ""}" onclick="ordTap(${k})"><span class="qnum">${n}</span></button>`)).join("")}</div>`,
  );
  st.bad = -1;
}
function ordTap(k) {
  const st = child.st,
    n = st.nums[k];
  if (n === st.sorted[st.placed.length]) {
    st.placed.push(n);
    say(NUMW[n] || String(n));
    render();
    if (st.placed.length === 4) {
      qLog(st.first);
      addStar(1);
      const nn = st.nums;
      setTimeout(() => {
        if (st.nums !== nn) return;
        say("Harika sıraladın!");
        st.r++;
        st.nums = null;
        render();
      }, 900);
    }
  } else {
    st.first = false;
    st.bad = k;
    say("Hımm, daha küçük bir sayı var.");
    render();
  }
}

async function sendParent() {
  busy("Veli portalı hazırlanıyor…");
  try {
    const html = await portalHTML(repWeek);
    const file = new File([html], `${fn(S.settings.student)}_Gelisim_Portali_${repWeek}.html`, {
      type: "text/html",
    });
    const text =
      weekText(repWeek) +
      "\n\n📎 Ekteki dosyayı açınca grafikler, ses kayıtları, yazı çalışmaları ve ev planı görünür.";
    busy(false);
    if (navigator.canShare && navigator.canShare({ files: [file], text })) {
      try {
        await navigator.share({ files: [file], text });
        wkObj(repWeek).sent = new Date().toISOString();
        save();
        toast("📨 Gönderildi");
        return;
      } catch (e) {
        if (e.name === "AbortError") return;

      `<h3>📨 Veliye gönder</h3><p class="mut">1) Mesajı kopyala ve WhatsApp'a yapıştır. 2) Portal dosyasını paylaş ya da indir ve ekle.</p><div class="mbtns"><button class="btn" onclick="copyText(${JSON.stringify(text).replace(/"/g, "&quot;")})">📋 Mesajı kopyala</button><button class="btn" onclick="doShare()">📤 Portal dosyası</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="doDownload()">⬇️ İndir</button>`,

/* ---- Rapor bölümleri: matematik haritası + yazı özeti ---- */
function matRep(logs) {
  const st = {};
  logs.forEach((l) => {
    if (l.a !== "q") return;
    const x = st[l.w] || (st[l.w] = { n: 0, ok: 0 });
    x.n++;
    if (l.ok) x.ok++;
  });
  const all = topicStats();
  const used = MAT_MAP.slice(0, 6)
    .map(([n, ks]) => {
      const its = ks.filter((k) => TOP[k] && all[k] && all[k].n);
      if (!its.length) return "";
      return `<div class="mr"><b>${esc(n)}</b><div>${its
        .map((k) => {
          const [i, t] = matStatus(k, all);
          const w = st[k];
          return `<span class="mc2 ${i === "⭐" ? "s" : i === "🟡" ? "y" : ""}">${i} ${esc(TOP[k].n)}${w ? ` <i>%${pct(w.ok, w.n)}</i>` : ""}</span>`;
        })
        .join("")}</div></div>`;
    })
    .join("");
  return used
    ? used +
        '<p class="m">⭐ öğrendi (en az 5 denemede %80) · 🟡 çalışıyoruz · yüzdeler bu haftaya aittir</p>'
    : "";
}

function legal(p, r, c, N) {
  const out = [];
  const add = (a, b) => {
    if (a >= 0 && b >= 0 && a < N && b < N && !(a === r && b === c)) out.push(a + "," + b);
  };
  const ray = (dr, dc) => {
    for (let i = 1; i < N; i++) add(r + dr * i, c + dc * i);
  };
  if (p === "kale" || p === "vezir") {
    ray(1, 0);
    ray(-1, 0);
    ray(0, 1);
    ray(0, -1);
  }
  if (p === "fil" || p === "vezir") {
    ray(1, 1);
    ray(1, -1);
    ray(-1, 1);
    ray(-1, -1);
  }
  if (p === "sah") for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) add(r + a, c + b);
  if (p === "at")
    [
      [1, 2],
      [2, 1],
      [-1, 2],
      [-2, 1],
      [1, -2],
      [2, -1],
      [-1, -2],
      [-2, -1],
    ].forEach(([a, b]) => add(r + a, c + b));
  if (p === "piyon") {
    add(r - 1, c);
    if (r === N - 2) add(r - 2, c);
  }
  return [...new Set(out)];
}

function roadItem(it, st) {
  const man = (S.road || {})[it[0]];
  if (man === true) return ["⭐", "tamam"];
  if (man === false) return ["⚪", "yok"];
  const src = it[2];
  if (src === "m") return ["⚪", "yok"];
  if (src.startsWith("L:")) {
    const g = LGROUPS[+src.slice(2) - 1];
    const L = new Set(learned());
    const n = g.filter((l) => L.has(l)).length;
    return n === g.length ? ["⭐", "tamam"] : n ? ["🟡", "devam"] : ["⚪", "yok"];
  }
  if (src.startsWith("w:")) {
    const n = S.works.filter((w) => w.kind === src.slice(2)).length;
    return n >= 5 ? ["⭐", "tamam"] : n ? ["🟡", "devam"] : ["⚪", "yok"];
  }
  const ks = src.slice(2).split("|");
  let n = 0,
    ok = 0;
  ks.forEach((k) => {
    const s = st[k];
    if (s) {
      n += s.n;
      ok += s.ok;
    }
  });
  if (!n) return ["⚪", "yok"];
  return pct(ok, n) >= 80 && n >= 5 ? ["⭐", "tamam"] : ["🟡", "devam"];
}
function roadState() {
  const st = topicStats();
  return ROAD.map((s) => {
    const its = s.items.map((it) => ({ it, v: roadItem(it, st) }));
    const done = its.filter((x) => x.v[1] === "tamam").length;
    return { s, its, done, p: Math.round((100 * done) / its.length) };
  });
}
function roadCurrent(R) {
  return R.findIndex((x) => x.p < 100);
}
function roadCard() {
  const R = roadState();

  return `<section class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🗺️ Yol haritası</h3><button class="btn ghost sm" onclick="openRoad()">Ayrıntı</button></div><div class="road">${R.map((x, i) => `<div class="rs ${i === cur ? "now" : ""} ${x.p === 100 ? "ok" : ""}"><span>${x.p === 100 ? "✅" : x.s.i}</span><b>${esc(x.s.n)}</b><i style="--p:${x.p}"></i><small>%${x.p}</small></div>`).join("")}</div>${cur >= 0 ? `<p class="mut" style="margin-top:8px">📍 Şu an: <b>${esc(R[cur].s.n)}</b> · sıradaki: ${esc((R[cur].its.find((x) => x.v[1] !== "tamam") || { it: ["", ""] }).it[1])}</p>` : "<p>🎉 Tüm yol tamamlandı!</p>"}</section>`;

async function addPhotos(files) {
  files = [...(files || [])];
  try {
    for (let i = 0; i < files.length; i++) {
      busy(`Fotoğraf ${i + 1}/${files.length}…`);
      const d = await shrinkImg(files[i], 1000);
      const id = uid();
      await idbSet("photo:" + id, d);
      const c = ensureSession();
      S.photos = (S.photos || []).concat([{ id, date: new Date().toISOString(), sid: c.id }]);
    }
    save();
    render();
    toast("📸 Fotoğraflar veli raporuna eklenecek");
  } catch (e) {
    toast(e.message);
  } finally {
    busy(false);
  }
}
async function photosOf(wk) {
  const out = [];
  for (const p of (S.photos || []).filter((p) => weekKey(p.date) === wk).slice(0, 8)) {
    try {
      const d = await idbGet("photo:" + p.id);
      if (d) out.push(d);
    } catch (e) {}
  }
  return out;
}
async function delPhoto(id) {
  S.photos = (S.photos || []).filter((p) => p.id !== id);

  save();
  render();
}

function payCard() {
  const fee = +S.settings.fee || 0;
  const ss = S.sessions.slice(0, 24);
  const paid = S.pay || {};
  const ym = (d) => new Date(d).toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
  const months = {};
  ss.forEach((s) => {
    const k = ym(s.date);
    const o = months[k] || (months[k] = { n: 0, p: 0 });
    o.n++;
    if (paid[s.id]) o.p++;
  });
  return `<section class="card"><h3>💳 Ders ücreti takibi</h3><div class="row"><label style="margin:0">Ders ücreti (₺)</label><input type="number" style="width:120px" value="${fee || ""}" onchange="S.settings.fee=+this.value;save();render()"></div>${Object.entries(
    months,
  )
    .map(
      ([m, o]) =>
        `<p><b>${esc(m)}</b>: ${o.n} ders · ${o.p} ödendi${fee ? ` · ${(o.n - o.p) * fee} ₺ bekliyor` : ""}</p>`,
    )
    .join(
      "",
    )}${ss.map((s) => `<div class="urow"><label><input type="checkbox" ${paid[s.id] ? "checked" : ""} onchange="S.pay=S.pay||{};S.pay['${s.id}']=this.checked;save();render()"> ${lessonNo(s.date)}. ders · ${fmtD(s.date)}</label></div>`).join("") || '<p class="mut">Bitmiş ders olunca burada listelenir.</p>'}</section>`;
}

async function onFile(d) {

  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70000; i++) {
    const x = Math.random() * W,
      y = Math.random() * H,
      r = Math.random();
    g.fillStyle =
      r < 0.5 ? `rgba(150,110,55,${Math.random() * 0.25})` : `rgba(255,248,225,${Math.random() * 0.35})`;

    tmp.height = H;
    const t = tmp.getContext("2d");

    } else {
      const txt = String(spec.text);
      t.font = `bold ${Math.round(H * 0.62)}px ${GFONT}`;
      t.textAlign = "center";
      t.textBaseline = "middle";
      t.setLineDash([3, 22]);

      t.lineCap = "round";
      t.strokeStyle = "rgba(110,75,35,.32)";
      t.strokeText(txt, W / 2, H * 0.52);

  <section class="card"><h3>🔑 API anahtarları (${keys.length})</h3><p class="mut">Birden çok anahtar ekleyebilirsin; kotası dolan otomatik en sona, çalışan en öne alınır.</p><div class="klist">${
    keys
      .map((k) => {
        const x = KST[keyState(k)];
        return `<div class="krow"><span title="${x[1]}">${x[0]}</span><code>${esc(maskKey(k))}</code><small>${x[1]}</small><button onclick="delKey('${k}')">✕</button></div>`;
      })
      .join("") || '<p class="mut">Henüz anahtar yok.</p>'
  }</div>
  <div class="row" style="margin-top:8px"><input id="newKey" placeholder="AIza… (birden çok da yapıştırabilirsin)" style="flex:1"><button class="btn" onclick="addKeyInput()">Ekle</button></div><div class="grid3" style="margin-top:6px"><button class="btn ghost sm" onclick="pasteKeys()">📥 Panodan yapıştır</button><button class="btn ghost sm" onclick="copyKeys()">📋 Tümünü kopyala</button><button class="btn ghost sm" onclick="ensureModels(true).then(m=>{toast('Modeller: '+m.slice(0,3).join(', '));render()})">🔄 Modelleri bul</button></div>
  <label>Model</label><select onchange="S.settings.model=this.value;save()"><option value="otomatik">Otomatik (en iyisini seç)</option>${(ZA.models || MODEL_ONCELIK).map((m) => `<option ${s.model === m ? "selected" : ""}>${m}</option>`).join("")}</select></section>
  <section class="card"><h3>📘 Ücretsiz anahtar nasıl alınır?</h3><ol class="steps"><li>Google hesabınla <b>aistudio.google.com/apikey</b> adresine gir.</li><li><b>“Create API key”</b> düğmesine bas.</li><li>Çıkan <b>AIza…</b> ile başlayan anahtarı kopyala.</li><li>Buraya dön, <b>📥 Panodan yapıştır</b>'a bas.</li><li><b>⚡ Test et</b> — yeşil 🟢 görünce hazırsın.</li></ol><a class="btn ok" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">🔗 Ücretsiz anahtar al</a><p class="mut" style="margin-top:8px">Ücretsiz anahtarın günlük bir kotası vardır. Birden çok anahtar eklersen biri dolunca sıradakine geçilir.</p></section>
  <section class="card"><h3>✨ Yapay zekâ ne yapıyor?</h3><ul class="steps"><li>✨ sağ alttaki asistan: ders planı, veli mesajı, ev ödevi, odak önerisi</li><li>📝 Notlar: not özeti ve davranış örüntüsü</li><li>📨 Veli: haftalık değerlendirme mektubu</li><li>📚 Hikâyeler: öğrendiği hecelerle yeni hikâye + 5N1K</li><li>📘 Kitap: PDF'ten ünite ve etkinlik çıkarma</li></ul><label class="tg"><input type="checkbox" ${s.hideAiFab ? "" : "checked"} onchange="S.settings.hideAiFab=!this.checked;save();aiFab()"> ✨ Asistan düğmesini göster</label><button class="btn ghost" style="margin-top:8px" onclick="openAI()">✨ Asistanı aç</button></section>`;
  }
  if (ayarTab === "cihaz")
    h += `<section class="card"><h3>📺 Tahta ve telefon</h3><p class="mut">Sistemi tahtada aç → <b>📺 Bu cihaz tahta</b>. Telefonda <b>📱 Bu cihaz kumanda</b> ya da QR'ı okut. Kitaplar, fotoğraflar, kayıtlar ve dersler parça parça aktarılır; ilerleme ekranın üstünde görünür. Bağlantı kodu: <b>${esc(pairCode())}</b></p><div class="grid2"><button class="btn ok" onclick="boardMode()">📺 Bu cihaz tahta</button><button class="btn ghost" onclick="askRemote()">📱 Bu cihaz kumanda</button></div></section><section class="card"><h3>🛟 Bağlantı olmazsa</h3><ol class="steps"><li><b>Kitap › 📤 Dosyayı paylaş</b> ile PDF'i WhatsApp'tan kendine gönder; tahtada WhatsApp Web'den indirip <b>➕ PDF</b> ile yükle.</li><li>Ya da <b>Yedek › 📦 Kitaplarla birlikte yedek</b> dosyasını tahtada aç.</li></ol></section>`;
  if (ayarTab === "ekran")
    h += `<section class="card"><h3>🧩 Çocuk ekranı ve tahta</h3><label class="tg"><input type="checkbox" ${s.sound ? "checked" : ""} onchange="S.settings.sound=this.checked;save()"> 🔊 Sesli yönergeler</label><label class="tg"><input type="checkbox" ${s.calm ? "checked" : ""} onchange="S.settings.calm=this.checked;save()"> 🌙 Sakin mod (hareketli animasyon yok)</label><label class="tg"><input type="checkbox" ${s.penOnly ? "checked" : ""} onchange="S.settings.penOnly=this.checked;save()"> ✏️ Yazı tahtasında sadece kalem (iPad)</label><label>Konuşma hızı</label><input type="range" min="0.6" max="1.1" step="0.05" value="${s.rate || 0.85}" onchange="S.settings.rate=+this.value;save();say('Merhaba '+S.settings.student)"><label>Ders günü</label><select onchange="S.settings.dow=+this.value;save()">${["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"].map((d, i) => `<option value="${i}" ${s.dow === i ? "selected" : ""}>Her ${d}</option>`).join("")}</select></section>`;
  if (ayarTab === "yedek")
    h += `<section class="card"><h3>💾 Yedek ve aktarma</h3><p class="mut">“Kitaplarla birlikte” dosyasını başka cihazda <b>📥 Yedek yükle</b> ile açınca her şey aynen gelir.</p><div class="grid2"><button class="btn" onclick="exportData(true)">📦 Kitaplarla birlikte</button><button class="btn ghost" onclick="exportData()">📤 Kitapsız yedek</button></div><label class="btn ghost file" style="width:100%;margin-top:6px">📥 Yedek yükle<input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label></section><section class="card"><h3>⚠️ Tehlikeli bölge</h3><button class="btn danger" onclick="resetAll()">Tüm verileri sil</button></section>`;
  if (ayarTab === "hakkinda")
    h += `<section class="card"><div class="verbox"><b>Sürüm ${APP_VER}</b><span>${APP_DATE}</span><span>${APP_LINES.toLocaleString("tr-TR")} satır kod · ${APP_KB} KB</span></div>${CHANGELOG.map((c) => `<div class="it"><span class="ic">🏷️</span><div><b>Sürüm ${c[0]}</b><small>${c[1]} — ${esc(c[2])}</small></div></div>`).join("")}</section>`;
  return h;
};
const _render7 = render;
render = function () {
  _render7();
  aiFab();
};
const _closeBoard7 = closeBoard;
closeBoard = function () {
  _closeBoard7();
  aiFab();
};
const _ms7 = mergeState;
mergeState = function (R) {
  const mine = S.notebook;
  _ms7(R);
  S.notebook = unionBy(
    mine,
    R.notebook,
    (x) => x.id,
    (a, b) => ((a.text || "").length >= (b.text || "").length ? a : b),
  ).sort((a, b) => new Date(b.date) - new Date(a.date));
  save();
};

/* ================== BAŞLAT ================== */
(function boot() {
  const q = new URLSearchParams(location.search);
  const t = q.get("tahta");
  if (t) {
    joinBoard(t.replace(/\D/g, ""));
    return;
  }
  scanAnn();
  render();
  const k = q.get("kumanda");
  if (k) setTimeout(() => phoneMode(k), 300);
})();
</script>
