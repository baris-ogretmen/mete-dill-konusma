<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b5bd6">
<title>Mete · Dil & Konuşma Robotu</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1e293b;--mut:#64748b;--pri:#5b5bd6;--pri-s:#eef0ff;--ok:#16a34a;--ok-s:#dcfce7;--y:#b45309;--y-s:#fef3c7;--bad:#dc2626;--bad-s:#fee2e2;--line:#e5e7ef;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(243,245,251,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top b{display:block;font-size:17px}.top small{color:var(--mut)}
.live{font-size:12px;color:var(--ok);background:var(--ok-s);padding:5px 10px;border-radius:99px;font-weight:700;white-space:nowrap;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05)}
h3{margin:0 0 10px;font-size:17px}
.sub{margin:18px 4px 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.mut{color:var(--mut);font-size:14px}
p{margin:6px 0}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=number]{width:84px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;margin:4px 0;text-align:center}
.btn.ghost{background:var(--pri-s);color:var(--pri)}
.btn.danger{background:var(--bad-s);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{width:100%;padding:16px;font-size:17px;margin-top:14px}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.file input{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;color:var(--mut);border-radius:12px;max-width:140px;margin:0 auto}
.nav span{font-size:21px}.nav small{font-size:10.5px;font-weight:700}
.nav .on{color:var(--pri);background:var(--pri-s)}
.hero{background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:#fff}
.hero .mut{color:#e0e7ff}
.garage{display:flex;align-items:center;gap:14px}
.bot{font-size:64px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.part{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;filter:grayscale(1);opacity:.4}
.part.on{filter:none;opacity:1;background:rgba(255,255,255,.3)}
.nx{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:10px}.nx i{display:block;height:100%;background:#fde047;border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:20px}.stats small{font-size:11px;color:var(--mut)}
.node{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);width:88%;border:0;text-align:left}
.node.r{margin-left:12%}
.node b{display:block}.node small{color:var(--mut)}
.bub{position:relative;width:54px;height:54px;border-radius:50%;flex:none;background:conic-gradient(var(--c,var(--pri)) calc(var(--p)*1%),#e5e7ef 0)}
.bub span{position:absolute;inset:5px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.node.tamam .bub{--c:var(--ok)}.node.bekliyor{opacity:.75}
.steps{margin:0;padding-left:20px}.steps li{margin:6px 0}
#modal{position:fixed;inset:0;z-index:160;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{background:#fff;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:760px){#modal{align-items:center}.mbox{border-radius:22px}}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.wc{border:1px solid var(--line);background:#fbfcff;border-radius:99px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:99px;border:1px dashed #cbd2e3;color:var(--mut);font-size:14px;background:#fff}.chip.on{border:1px solid var(--pri);background:var(--pri-s);color:var(--pri);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:22px}
.sbtn small{font-size:16px;font-weight:400}.sbtn.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:250;background:rgba(255,255,255,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600;text-align:center;padding:24px}
#busy.on{display:flex}
.pbar{width:min(80vw,320px);height:10px;border-radius:9px;background:#e5e7ef;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.spin{font-size:56px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.mood,.rate{display:flex;gap:8px}.mood button,.rate button{flex:1;border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:10px;font-size:22px}.rate button{font-size:16px;font-weight:700}.mood .on,.rate .on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
.urow{display:flex;align-items:center;gap:8px;margin:6px 0}.urow label{margin:0;flex:1;color:var(--ink);font-weight:500;display:flex;gap:8px;align-items:center;font-size:15px}.urow input{width:auto}.urow select{width:auto;padding:6px 8px;font-size:13px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rf{width:100%;border:0;border-radius:14px;background:#fff;min-height:420px;display:block}
.pv{position:relative}.pv img{width:100%;border-radius:10px;margin-top:10px;background:#f8fafc;min-height:200px;display:block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.it>div{flex:1;min-width:0}.it small{color:var(--mut);display:block}
.it .ic{font-size:26px}
.tg{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;font-size:15px}.tg input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;color:var(--mut)}.seg .on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{border:2px dashed #c7cdf0;border-radius:16px;padding:22px 12px;text-align:center;background:#fafbff;cursor:pointer;display:block}
.drop b{display:block;font-size:17px;color:var(--pri)}.drop.hov{background:var(--pri-s);border-color:var(--pri)}
.scard{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sL{width:52px;height:52px;flex:none;border-radius:14px;background:var(--pri-s);color:var(--pri);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sbar{height:12px;border-radius:8px;background:#eceef5;overflow:hidden;margin:6px 0 2px}.sbar i{display:block;height:100%;border-radius:8px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.cnt button{border:0;border-radius:16px;padding:16px 4px;font-weight:800;font-size:18px}
.cnt .g{background:var(--ok-s);color:var(--ok)}.cnt .y{background:var(--y-s);color:var(--y)}.cnt .n{background:#f1f5f9;color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.gal button{border:0;padding:0;background:#f1f5f9;border-radius:12px;overflow:hidden;aspect-ratio:3/4}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.recrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.recrow>div{flex:1;min-width:0}.recrow small{display:block;color:var(--mut)}
.recrow button{border:0;background:var(--pri-s);color:var(--pri);border-radius:10px;width:40px;height:40px;font-size:18px}
.recrow .st.on{background:#fef3c7}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.goal>div{flex:1}.goal small{color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--pri-s);color:var(--pri)}.badge.ok{background:var(--ok-s);color:var(--ok)}
/* ===== ÇOCUK EKRANI ===== */
.kid{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#eef2ff,#ecfdf5);display:flex;flex-direction:column;overflow:auto;user-select:none;-webkit-user-select:none}
.kbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;gap:8px}
.lock{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:20px;opacity:.45;transition:transform 1.2s,opacity .3s;touch-action:none}
.lock.hold{transform:scale(1.35);opacity:1;background:#fde68a}
.kst{font-size:22px;font-weight:800;background:#fff;padding:6px 16px;border-radius:99px;box-shadow:0 3px 0 #dfe3f3}
.ksnd{font-size:15px;font-weight:800;background:#fff;padding:6px 12px;border-radius:99px;color:var(--pri);box-shadow:0 3px 0 #dfe3f3}
.kb{width:48px;height:48px;border:0;border-radius:14px;background:#fff;font-size:24px;box-shadow:0 3px 0 #dfe3f3}
.kmain{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.khello{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:14px 20px;box-shadow:0 4px 0 #dfe3f3;width:min(100%,720px);border:0;text-align:left}
.kro{font-size:60px;animation:bob 2.4s ease-in-out infinite}
.khello b{font-size:24px;display:block}.khello small{color:var(--mut);font-size:15px}
.ktiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(100%,720px)}
.ktile{position:relative;border:0;background:#fff;border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #dfe3f3}
.kti{font-size:52px}.ktn{font-weight:700;font-size:16px}
.ktile em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;font-weight:800;background:var(--pri);color:#fff;padding:3px 8px;border-radius:99px}
.ktile.now{outline:4px solid #fbbf24}
.ktile.done{opacity:.55}.ktile.done em{background:var(--ok)}
.kq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.kbig{width:72px;height:72px;border-radius:50%;border:0;background:#fff;font-size:34px;box-shadow:0 4px 0 #dfe3f3}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:#cbd5e1}.dots i.on{background:#22c55e}
.kopts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.kcard{position:relative;width:min(29vw,180px);aspect-ratio:1;border:0;border-radius:26px;background:#fff;font-size:clamp(46px,14vw,100px);box-shadow:0 6px 0 #dfe3f3;display:flex;align-items:center;justify-content:center}
.kcard:active{transform:translateY(4px);box-shadow:0 2px 0 #dfe3f3}
.kcard.tgt{outline:6px solid #fbbf24}
.kcard .cap{position:absolute;bottom:6px;left:0;right:0;font-size:15px;font-weight:700;color:var(--mut)}
.hint{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px #fde68a}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(92vw,400px,52vh);background:#c7d2fe;padding:6px;border-radius:18px}
.rc{aspect-ratio:1;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,40px)}
.rc.w{background:#94a3b8}.rc.t{background:#fef9c3}
.prog{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:46px;align-items:center;background:#fff;border-radius:16px;padding:6px 10px;width:min(92vw,400px)}
.pc{font-size:24px;border-radius:8px;padding:0 2px}.pc.on{background:#bbf7d0}.pc.bad{background:#fecaca}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:10px}
.pad button{height:74px;border:0;border-radius:20px;background:#fff;font-size:34px;box-shadow:0 5px 0 #dfe3f3}
.pad .go{background:#22c55e;box-shadow:0 5px 0 #15803d}.pad .del{background:#fee2e2}
.pad button:disabled{opacity:.4}
.pz{display:grid;gap:5px;width:min(84vw,360px,50vh);background:#c7d2fe;padding:5px;border-radius:16px}
.pz img{width:100%;display:block;border-radius:8px;border:3px solid transparent}
.pz img.sel{border-color:#f59e0b;transform:scale(.93)}.pz img.ok{border-color:#86efac}
.pzprev{font-size:46px;background:#fff;border-radius:16px;padding:2px 12px}
.hE{font-size:clamp(90px,22vw,150px);line-height:1}
.hs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hb{border:0;border-radius:18px;padding:14px 20px;font-size:30px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .2s}
.hb.c0{background:#6366f1}.hb.c1{background:#f97316}.hb.c2{background:#10b981}.hb.c3{background:#ec4899}
.hb.lit{transform:scale(1.22) translateY(-6px)}
.kbtn{border:0;border-radius:20px;padding:16px 22px;font-size:19px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 5px 0 #3f3fb0;min-width:220px}
.kbtn.alt{background:#fff;color:var(--pri);box-shadow:0 5px 0 #dfe3f3}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.slot{width:min(24vw,116px);aspect-ratio:1;border-radius:22px;border:3px dashed #a5b4fc;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,12vw,70px);background:rgba(255,255,255,.5);position:relative}.slot small{position:absolute;top:4px;left:8px;font-size:14px;font-weight:800;color:#6366f1}
.slot.f{border-style:solid;background:#fff}
.kdone{font-size:20px;font-weight:800;background:#dcfce7;border-radius:20px;padding:14px 20px;text-align:center}
.kgar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.kgar span{font-size:28px;opacity:.22;filter:grayscale(1)}.kgar span.on{opacity:1;filter:none}
/* drill */
.track{display:flex;gap:4px;width:min(94vw,640px);background:#fff;border-radius:18px;padding:6px;box-shadow:0 4px 0 #dfe3f3;position:relative}
.track i{flex:1;height:40px;border-radius:10px;background:#eef0f6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.track i.g{background:#bbf7d0}.track i.y{background:#fde68a}.track i.n{background:#e2e8f0}.track i.cur{outline:3px solid #6366f1}
.track i.end{background:#e0e7ff}
.dcard{background:#fff;border-radius:30px;box-shadow:0 8px 0 #dfe3f3;padding:18px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:min(86vw,360px);border:0}
.dE{font-size:clamp(90px,24vw,170px);line-height:1.05}
.dW{font-size:clamp(28px,7vw,46px);font-weight:800;letter-spacing:.02em;text-align:center}
.dW .hl{color:#e11d48;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.syl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.syl span{font-size:clamp(46px,12vw,80px);font-weight:900;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-radius:22px;padding:6px 22px}
.tbar{position:sticky;bottom:0;display:flex;gap:8px;width:min(96vw,640px);background:rgba(255,255,255,.95);border-radius:20px;padding:8px;box-shadow:0 -2px 14px rgba(15,23,42,.08);margin-top:auto}
.tbar button{flex:1;border:0;border-radius:14px;padding:12px 4px;font-weight:800;font-size:15px}
.tbar .g{background:var(--ok-s);color:var(--ok)}.tbar .y{background:var(--y-s);color:var(--y)}.tbar .n{background:#f1f5f9;color:var(--mut)}
.tbar .rec{flex:0 0 56px;background:#fee2e2;color:#dc2626;font-size:20px}.tbar .rec.on{background:#dc2626;color:#fff;animation:pulse 1s infinite}
.tlab{font-size:11px;color:var(--mut);font-weight:700;text-align:center;width:100%}
.train{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.train button{border:0;background:#fff;border-radius:18px;padding:10px 14px;font-size:30px;box-shadow:0 5px 0 #dfe3f3;white-space:nowrap}
.mpwrap{position:relative;display:flex;gap:min(10vw,80px);justify-content:center;align-items:center;margin-top:20px}
.mpbot{font-size:64px;transition:transform .7s cubic-bezier(.5,1.6,.5,1)}
.mode2{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#sp{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px}
#sp.on{display:flex}
.spbox{background:#fff;border-radius:28px;padding:22px;width:min(100%,460px);text-align:center}
.spE{font-size:92px;line-height:1.1}.spW{font-size:30px;font-weight:800;margin:6px 0 10px}
.spW .hl{color:#e11d48}
.say{border:0;background:var(--pri-s);color:var(--pri);border-radius:99px;padding:10px 18px;font-weight:700}
.sprow{display:grid;grid-template-columns:repeat(3,1fr) 56px;gap:8px;margin-top:16px}
.sprow button{border:0;border-radius:16px;padding:14px 4px;font-weight:700;font-size:14px}
.sprow .g{background:var(--ok-s);color:var(--ok)}.sprow .y{background:var(--y-s);color:var(--y)}.sprow .n{background:#f1f5f9;color:var(--mut)}.sprow .rec{background:#fee2e2;color:#dc2626;font-size:20px}.sprow .rec.on{background:#dc2626;color:#fff}
.sph{font-size:12px;color:var(--mut);margin-top:10px}
#cel{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.82);pointer-events:none}

let trVoice=null;

function mkU(t,r){const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=r||S.settings.rate||0.85;if(trVoice)u.voice=trVoice;return u}
function say(t,r){if(!S.settings.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();speechSynthesis.speak(mkU(t,r))}catch(e){}}
function sayQ(arr,each,done,i){i=i||0;if(!S.settings.sound||!('speechSynthesis' in window)){done&&done();return}if(i===0)speechSynthesis.cancel();if(i>=arr.length){done&&done();return}each&&each(i);const u=mkU(arr[i]);let f=false;const nx=()=>{if(f)return;f=true;setTimeout(()=>sayQ(arr,each,done,i+1),350)};u.onend=nx;setTimeout(nx,2600);speechSynthesis.speak(u)}

/* ================== HECE & SES KONUMU ================== */
const VOW='aeıioöuüâîû';
function hece(w){const s=[...low(w)];const vi=[];s.forEach((c,i)=>{if(VOW.includes(c))vi.push(i)});if(vi.length<2)return[w];const cuts=[];for(let k=1;k<vi.length;k++){const a=vi[k-1],b=vi[k];cuts.push(b-a-1<=0?b:b-1)}const out=[];let st=0;cuts.forEach(c=>{out.push(s.slice(st,c).join(''));st=c});out.push(s.slice(st).join(''));return out.filter(Boolean)}
const heceOf=w=>String(w).trim().split(/\s+/).flatMap(hece);
function posOf(w,s){const l=low(w);const r=new Set();if(!s||!l.includes(s))return r;if(l.startsWith(s))r.add('bas');if(l.endsWith(s))r.add('son');for(let i=1;i<l.length-1;i++)if(l[i]===s)r.add('orta');return r}
function hlWord(w,s){if(!s)return esc(w);return [...String(w)].map(c=>low(c)===s?`<span class="hl">${esc(c)}</span>`:esc(c)).join('')}
function sylls(s){const V='aeıiouöü';const cv=[...V].map(v=>s+v),vc=[...V].map(v=>v+s),vcv=['a','e','i','o','u'].map(v=>v+s+v);return {cv,vc,vcv}}

function allWords(){const extra=[];S.units.forEach(u=>(u.words||[]).forEach(x=>extra.push({w:x.w,e:x.e,c:x.c})));(S.customWords||[]).forEach(x=>extra.push(x));const seen=new Set();return extra.concat(WB).filter(x=>x&&x.w&&!x.w.includes(' ')&&!seen.has(x.w)&&seen.add(x.w))}
function poolFor(s,pos){const all=allWords();if(!s)return all;const list=all.filter(x=>{const p=posOf(x.w,s);return pos&&pos!=='karisik'?p.has(pos):p.size>0});return list}
function unitWordsOr(n){const u=curUnit();const ws=u&&u.words&&u.words.length>=3?u.words:null;const s=child&&child.cfg&&child.cfg.s;let base=ws?ws:poolFor(s,'karisik');if(base.length<n)base=base.concat(WB);return shuffle(base).slice(0,n)}
function seqOf(u){return u&&u.seq&&u.seq.length?u.seq:BASE_SEQ}
function allTrials(){return S.sessions.flatMap(s=>s.trials||[]).concat(S.current?S.current.trials:[])}
function allLogs(){return S.sessions.flatMap(s=>s.log||[]).concat(S.current?S.current.log:[])}
function unitProg(u){if(u.status==='tamam')return 100;const ws=(u.words||[]).map(w=>w.w);if(!ws.length)return u.status==='calisiliyor'?10:0;const said=new Set();allTrials().forEach(t=>{if(t.r==='+')said.add(t.w)});allLogs().forEach(l=>{if(l.sp==='soyledi')said.add(l.w)});return Math.round(100*ws.filter(w=>said.has(w)).length/ws.length)}
function emojiOf(w){const lw=low(w);const f=allWords().find(x=>x.w===lw);if(f)return f.e;for(const p of MP){if(p.a[1]===lw)return p.a[0];if(p.b[1]===lw)return p.b[0]}const p=lw.split(' ');if(p.length>1){for(const x of p){const g=allWords().find(y=>y.w===x);if(g)return g.e}}return '💬'}
function ensureSession(){if(!S.current){S.current={id:uid(),start:Date.now(),date:new Date().toISOString(),log:[],trials:[],unitIds:[],done:[],stars:0,mood:'',att:0,notes:'',home:'',pages:'',letter:'',works:[],recs:[]};save()}return S.current}

function tint(hex,k){k=k==null?.78:k;const n=parseInt(hex.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;const m=x=>Math.round(x+(255-x)*k);return `rgb(${m(r)},${m(g)},${m(b)})`}

/* ---- Hafta hesapları ---- */
function weekKey(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return dISO(x)}
function weekRange(wk){const a=new Date(wk+'T12:00:00');const b=new Date(a);b.setDate(a.getDate()+6);return [a,b]}
function weekLabel(wk){const [a,b]=weekRange(wk);return `${fmtS(a)} – ${fmtD(b)}`}
function addWeeks(wk,n){const a=new Date(wk+'T12:00:00');a.setDate(a.getDate()+7*n);return dISO(a)}
function sessionsAll(){return S.sessions.concat(S.current?[S.current]:[])}
function sessionsOfWeek(wk){return sessionsAll().filter(s=>weekKey(s.date)===wk)}
function weeksList(){const set=new Set(sessionsAll().map(s=>weekKey(s.date)));set.add(weekKey(Date.now()));return [...set].sort().reverse()}
function soundStats(trials){const by={};trials.forEach(t=>{if(!t.s)return;const o=by[t.s]||(by[t.s]={n:0,p:0,y:0,m:0,lv:{},ps:{},words:{}});o.n++;if(t.r==='+')o.p++;else if(t.r==='~')o.y++;else o.m++;const l=o.lv[t.lvl]||(o.lv[t.lvl]={n:0,p:0});l.n++;if(t.r==='+')l.p++;if(t.lvl==='kelime'||t.lvl==='cumle'){const q=o.ps[t.pos]||(o.ps[t.pos]={n:0,p:0});q.n++;if(t.r==='+')q.p++}});Object.values(by).forEach(o=>{o.acc=pct(o.p,o.n);o.cueAcc=pct(o.p+o.y,o.n)});return by}
function sessData(s){const L=s.log||[];const T=s.trials||[];const words={};const rank={'+':3,'~':2,'-':1};T.forEach(t=>{if(!t.w||t.lvl==='izole'||t.lvl==='hece')return;if(!words[t.w]||rank[t.r]>rank[words[t.w]])words[t.w]=t.r});L.forEach(l=>{if(!l.sp)return;const r=l.sp==='soyledi'?'+':l.sp==='yardim'?'~':'-';if(!words[l.w]||rank[r]>rank[words[l.w]])words[l.w]=r});
 const acts={};L.forEach(l=>{const a=acts[l.a]||(acts[l.a]={ok:0,tr:0});if(l.ok)a.ok++;else a.tr++});T.forEach(t=>{if(t.g&&t.g!=='masa'){const a=acts[t.g]||(acts[t.g]={ok:0,tr:0});if(t.r==='+')a.ok++;else a.tr++}});
 const units=(s.unitIds||[]).map(id=>S.units.find(u=>u.id===id)).filter(Boolean);const mins=s.end?Math.max(1,Math.round((s.end-s.start)/60000)):null;return{words,acts,units,mins,snd:soundStats(T),n:T.length,p:T.filter(t=>t.r==='+').length}}
function paStats(logs){const o={};const add=(k,ok)=>{const x=o[k]||(o[k]={n:0,ok:0});x.n++;if(ok)x.ok++};logs.forEach(l=>{if(l.a==='hece')add('hece',l.ok);else if(l.a==='ilkses')add('ilkses',l.ok);else if(l.a==='mpd')add('mpd',l.ok);else if(l.a==='mps')add('mps',l.ok)});return o}
const PA_N={hece:'🚂 Hece sayma',ilkses:'🔍 İlk sesi bulma',mpd:'👂 Minimal çift — dinleyip ayırt etme',mps:'🗣️ Minimal çift — söyleyip anlaşılma'};
function weekData(wk){const ss=sessionsOfWeek(wk).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));const T=ss.flatMap(s=>s.trials||[]);const L=ss.flatMap(s=>s.log||[]);const prevT=sessionsOfWeek(addWeeks(wk,-1)).flatMap(s=>s.trials||[]);
 const snd=soundStats(T),prev=soundStats(prevT);const words={};const rank={'+':3,'~':2,'-':1};ss.forEach(s=>Object.entries(sessData(s).words).forEach(([w,r])=>{if(!words[w]||rank[r]>rank[words[w]])words[w]=r}));
 const acts={};ss.forEach(s=>Object.entries(sessData(s).acts).forEach(([k,v])=>{const a=acts[k]||(acts[k]={ok:0,tr:0});a.ok+=v.ok;a.tr+=v.tr}));
 const mins=ss.reduce((a,s)=>a+(s.end?Math.max(1,Math.round((s.end-s.start)/60000)):0),0);const units=[...new Set(ss.flatMap(s=>s.unitIds||[]))].map(id=>S.units.find(u=>u.id===id)).filter(Boolean);
 const works=S.works.filter(w=>weekKey(w.date)===wk);const recs=S.recs.filter(r=>weekKey(r.date)===wk);
 return {wk,ss,T,L,snd,prev,words,acts,mins,units,works,recs,pa:paStats(L),n:T.length,p:T.filter(t=>t.r==='+').length,y:T.filter(t=>t.r==='~').length,stars:ss.reduce((a,s)=>a+(s.stars||0),0)}}
function trend(s,n){n=n||8;const wk=weekKey(Date.now());const out=[];for(let i=n-1;i>=0;i--){const k=addWeeks(wk,-i);const T=sessionsOfWeek(k).flatMap(x=>x.trials||[]).filter(t=>t.s===s);out.push({wk:k,acc:T.length?pct(T.filter(t=>t.r==='+').length,T.length):null,n:T.length})}return out}
function trendUpTo(s,wk,n){n=n||8;const out=[];for(let i=n-1;i>=0;i--){const k=addWeeks(wk,-i);const T=sessionsOfWeek(k).flatMap(x=>x.trials||[]).filter(t=>t.s===s);out.push({wk:k,acc:T.length?pct(T.filter(t=>t.r==='+').length,T.length):null,n:T.length})}return out}
function spark(tr,w,h,col){w=w||220;h=h||56;const pts=tr.map((t,i)=>t.acc==null?null:[8+i*(w-16)/Math.max(1,tr.length-1),h-8-(t.acc/100)*(h-16)]);const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);const last=pts.filter(Boolean).pop();
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;max-width:100%"><line x1="8" x2="${w-8}" y1="${h-8-(80/100)*(h-16)}" y2="${h-8-(80/100)*(h-16)}" stroke="#16a34a" stroke-dasharray="3 4" stroke-width="1" opacity=".5"/><line x1="8" x2="${w-8}" y1="${h-8}" y2="${h-8}" stroke="#e5e7ef"/>${segs.map(sg=>sg.length>1?`<polyline points="${sg.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${col||'#5b5bd6'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:'').join('')}${pts.map(p=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${p===last?5:3.5}" fill="${p===last?(col||'#5b5bd6'):'#fff'}" stroke="${col||'#5b5bd6'}" stroke-width="2"/>`:'').join('')}</svg>`}

/* ================== DEPOLAMA (IndexedDB) ================== */
let _db=null;
function idb(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{const r=indexedDB.open('mete_dk',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Depolama dolu'))})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('f','readonly');const r=tx.objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const db=await idb();return new Promise(res=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res()})}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function dataToBlob(d){return (await fetch(d)).blob()}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
async function ensurePdfjs(){if(window.pdfjsLib)return;await loadJs(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
const bookOf=id=>S.books.find(b=>b.id===id);
async function getPdf(b){if(PDFS[b.id])return PDFS[b.id];await ensurePdfjs();let buf=null;try{buf=await idbGet(b.key)}catch(e){}if(!buf)return null;PDFS[b.id]=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise;return PDFS[b.id]}
async function pageImg(bookId,n,w,q){const b=bookOf(bookId);if(!b)throw new Error('Kitap bulunamadı');if(b.type==='img'){const arr=PDFS[b.id]||(PDFS[b.id]=await idbGet(b.key));if(!arr||!arr[n-1])throw new Error('Sayfa bulunamadı');return arr[n-1]}
 const pdf=await getPdf(b);if(!pdf)throw new Error('PDF cihazda bulunamadı, Kitap sekmesinden yeniden yükle');const p=await pdf.getPage(n);const v0=p.getViewport({scale:1});const v=p.getViewport({scale:(w||1000)/v0.width});const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await p.render({canvasContext:g,viewport:v}).promise;return c.toDataURL('image/jpeg',q||.75)}
function fileSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}
async function addBookFiles(files){files=[...(files||[])];if(!files.length)return;const pdfs=files.filter(f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name));const imgs=files.filter(f=>/^image\//.test(f.type));for(const f of pdfs)await addPdf(f);if(imgs.length)await addImgBook(imgs);render()}
async function addPdf(f){busy(`“${f.name}” okunuyor… (${fileSize(f.size)})`,5);try{if(f.size>250*1048576)throw new Error('Dosya çok büyük ('+fileSize(f.size)+'). PDF\'i parçalara böl ya da sayfaların fotoğrafını yükle.');
 const buf=await f.arrayBuffer();busy('PDF kütüphanesi hazırlanıyor…',20);await ensurePdfjs();busy('Sayfalar sayılıyor…',35);const task=pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false});task.onProgress=p=>{if(p.total)busy('PDF açılıyor…',35+Math.round(40*p.loaded/p.total))};const pdf=await task.promise;
 const id=uid();const b={id,name:f.name.replace(/\.pdf$/i,''),pages:pdf.numPages,type:'pdf',key:'book:'+id,added:Date.now(),size:f.size};busy('Cihaza kaydediliyor…',85);let stored=true;try{await idbSet(b.key,buf)}catch(e){stored=false}
 PDFS[id]=pdf;S.books.push(b);pvBook=id;pvPage=1;save();toast(`✅ ${pdf.numPages} sayfa yüklendi${stored?'':' (cihaza kaydedilemedi — sadece bu oturumda açık)'}`)}catch(e){toast('PDF açılamadı: '+(e.message||e)+(String(e.message).includes('password')?' (şifreli PDF)':''))}finally{busy(false)}}
async function shrinkImg(f,max){max=max||1400;const url=URL.createObjectURL(f);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Görsel açılamadı: '+f.name));i.src=url});const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}finally{URL.revokeObjectURL(url)}}
async function addImgBook(files){const name=prompt('Bu fotoğraflar için kitap adı:','Kitap sayfaları '+fmtS(Date.now()))||'Fotoğraflı kitap';files.sort((a,b)=>a.name.localeCompare(b.name,'tr',{numeric:true}));const arr=[];try{for(let i=0;i<files.length;i++){busy(`Fotoğraf ${i+1}/${files.length} hazırlanıyor…`,Math.round(100*i/files.length));arr.push(await shrinkImg(files[i]))}const id=uid();const b={id,name,pages:arr.length,type:'img',key:'book:'+id,added:Date.now()};try{await idbSet(b.key,arr)}catch(e){toast('Cihaza kaydedilemedi')}PDFS[id]=arr;S.books.push(b);pvBook=id;pvPage=1;save();toast(`✅ ${arr.length} sayfa eklendi`)}catch(e){toast(e.message)}finally{busy(false)}}

function actPrompt(u){const snd=activeSounds();return `Görseller bir dil ve konuşma kitabının "${u.title}" ünitesine ait sayfalar${u.goal?' (hedef: '+u.goal+')':''}. ${ctx()}\nBu sayfalardaki hedef kelime ve kavramlardan etkinlik içeriği üret.${snd.length?` Mümkün olduğunca hedef sesleri (${snd.join(', ')}) farklı konumlarda (başta, ortada, sonda) içeren kelimeler seç.`:''} Kelimeler somut ve TEK bir emoji ile net gösterilebilir olmalı. Sadece şu JSON'u döndür:\n{"hedef":"kısa hedef","kelimeler":[{"kelime":"elma","emoji":"🍎","renk":"kırmızı"}],"siralamalar":[[{"emoji":"🥚","ifade":"yumurta"},{"emoji":"🐣","ifade":"civciv"},{"emoji":"🐔","ifade":"tavuk"}]],"cumleler":["iki-üç kelimelik hedef cümle"],"ev":"ailenin evde 5 dakikada oynayabileceği kısa oyun"}\nKurallar: 10-14 tek kelimelik kelime; 2-4 adet 3 adımlı önce-sonra sıralaması; 3-5 cümle. "renk" sadece nesnenin tipik rengi belliyse ve şu listedense: kırmızı, mavi, sarı, yeşil, turuncu, mor, pembe, kahverengi, siyah, beyaz.`}
function applyAi(u,r){const ws=(r.kelimeler||[]).filter(k=>k&&k.kelime&&k.emoji).map(k=>({w:low(k.kelime),e:String(k.emoji).trim(),c:COLORS[low(k.renk)]?low(k.renk):''}));if(ws.length)u.words=ws;const sq=(r.siralamalar||[]).filter(a=>Array.isArray(a)&&a.length>=3).map(a=>a.slice(0,4).map(x=>({e:x.emoji||'❓',t:String(x.ifade||'')})));if(sq.length)u.seq=sq;if(Array.isArray(r.cumleler))u.sent=r.cumleler.map(String);if(r.ev)u.home=String(r.ev);if(!u.goal&&r.hedef)u.goal=String(r.hedef)}
async function aiActs(id,bulk){const u=S.units.find(x=>x.id===id);if(!u)return false;const b=bookOf(u.bookId);if(!bulk&&!b&&!confirm('Bu ünitenin kitabı yüklü değil. Sadece başlığa göre üretilsin mi?'))return false;if(!bulk)busy(`“${u.title}” için etkinlikler hazırlanıyor…`);try{const parts=[{text:actPrompt(u)}];if(b){const a=Math.max(1,u.from|0),z=Math.min(b.pages,Math.max(u.to|0,a));const step=Math.max(1,Math.ceil((z-a+1)/8));for(let p=a;p<=z;p+=step)parts.push(im(await pageImg(b.id,p,1000)))}applyAi(u,await gemini(parts));save();if(!bulk){toast('Etkinlikler hazır');openUnit(id)}return true}catch(e){toast('AI hatası: '+e.message);return false}finally{if(!bulk)busy(false)}}
async function aiAll(){const list=S.units.filter(u=>!u.words||u.words.length<3);if(!list.length)return toast('Tüm ünitelerin etkinlikleri hazır');let ok=0;for(let i=0;i<list.length;i++){busy(`${i+1}/${list.length} · ${list[i].title}`,Math.round(100*i/list.length));if(await aiActs(list[i].id,true))ok++}busy(false);toast(`${ok} ünite için etkinlik üretildi`);render()}

 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Bu tarayıcı ses kaydını desteklemiyor (Safari/Chrome güncel olmalı)');let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return toast('Mikrofon izni verilmedi'+(location.protocol==='file:'?' — sistemi internetteki sitenden aç':''))}
 const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){stream.getTracks().forEach(t=>t.stop());return toast('Kayıt başlatılamadı')}
 const chunks=[];const t0=Date.now();const m=Object.assign({},meta||{});mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=async()=>{clearTimeout(REC.timer);stream.getTracks().forEach(t=>t.stop());REC.mr=null;recUI();if(!chunks.length)return;const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/mp4'});const id=uid();try{await idbSet('rec:'+id,blob)}catch(e){return toast('Kayıt cihaza yazılamadı')}const c=ensureSession();S.recs.unshift({id,date:new Date().toISOString(),w:low(m.w||''),s:m.s||'',lvl:m.lvl||'',sid:c.id,star:false,dur:Math.round((Date.now()-t0)/1000),type:blob.type});c.recs.push(id);save();toast('🎙️ Ses kaydedildi'+(m.w?': '+m.w:''));if(!child&&view==='kayit')render()};

async function exportData(){busy('Yedek hazırlanıyor…');try{const media={};for(const w of S.works){const d=await idbGet('work:'+w.id);if(d)media['work:'+w.id]=d}for(const r of S.recs){const b=await idbGet('rec:'+r.id);if(b)media['rec:'+r.id]=await blobToData(b)}offerShare(new Blob([JSON.stringify({state:S,media})],{type:'application/json'}),`${fn(S.settings.student)}_DilKonusma_Yedek_${dISO(Date.now())}.json`,'application/json')}catch(e){toast('Yedek alınamadı: '+e.message)}finally{busy(false)}}
async function importData(f){if(!f)return;try{const o=JSON.parse(await f.text());const st=o.state||o;if(!st||!Array.isArray(st.sessions))throw new Error('Geçersiz yedek');if(!confirm('Mevcut veriler yedektekiyle değiştirilsin mi?'))return;S=migrate(st);if(o.media)for(const [k,v] of Object.entries(o.media)){await idbSet(k,k.startsWith('rec:')?await dataToBlob(v):v)}save();render();toast('Yedek yüklendi')}catch(e){toast('Yedek okunamadı: '+e.message)}}
function resetAll(){if(!confirm('TÜM dersler, kayıtlar, kitaplar ve ayarlar silinecek. Emin misin?'))return;S=migrate({v:2});save();try{_db&&_db.close();_db=null;indexedDB.deleteDatabase('mete_dk')}catch(e){}for(const k in PDFS)delete PDFS[k];render()}

/* ---- Paylaşım ---- */
function offerShare(blob,name,type){pend=new File([blob],name,{type});modal(`<h3>✅ Hazır</h3><p class="mut">${esc(name)} · ${fileSize(blob.size)}</p><div class="mbtns"><button class="btn" onclick="doShare()">📤 Paylaş (WhatsApp…)</button><button class="btn ghost" onclick="doDownload()">⬇️ İndir</button></div>`)}
async function doShare(){if(!pend)return;if(navigator.canShare&&navigator.canShare({files:[pend]})){try{await navigator.share({files:[pend]});closeModal()}catch(e){if(e.name!=='AbortError')toast('Paylaşılamadı — İndir\'i dene')}}else doDownload()}
function doDownload(){if(!pend)return;const a=document.createElement('a');a.href=URL.createObjectURL(pend);a.download=pend.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Metin kopyalandı — WhatsApp\'a yapıştır')).catch(()=>prompt('Kopyala:',t))}

const wrapDoc=(t,inner,script)=>`<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(t)}</title><style>body{margin:0;background:#f3f5fb}${REP_CSS}</style></head><body>${inner}${script?`<script>${script}<\/script>`:''}</body></html>`;
const RI={'+':'✅','~':'🟡','-':'⏳'};
const GAME_N=Object.assign({},Object.fromEntries(Object.entries(ACTS).map(([k,v])=>[k,v.i+' '+v.n])),{mpd:'🎯 Minimal Çift (dinle)',mps:'🎯 Minimal Çift (söyle)',masa:'📖 Kitapla masa başı'});
const wkObj=wk=>S.weeks[wk]||(S.weeks[wk]={letter:'',focus:'',note:'',homeDays:null,plan:null});
const HOME_GAMES=['Kart çevirme: resmi çevir, adını söyle, kartı kazan','Robot gibi söyle: önce hece hece, sonra bütün','Saklambaç: resmi saklayın, bulunca adını söylesin','Ayna oyunu: aynanın karşısında birlikte söyleyin','Zıpla-söyle: her zıplayışta bir kelime','Kutudan çek: kutudan çıkan resmin adını söylesin','Lego kuleleri: her doğru söyleyişte bir parça ekleyin'];
function makePlan(wk){const W=weekData(wk);const act=activeSounds();const sounds=act.length?act:Object.keys(W.snd);const items=[];const seen=new Set();const push=x=>{if(x&&x.w&&!seen.has(x.w)){seen.add(x.w);items.push({w:x.w,e:x.e||emojiOf(x.w)})}};
 W.T.filter(t=>t.r!=='+'&&t.lvl!=='izole'&&t.lvl!=='hece'&&t.w&&!t.w.includes(' ')).forEach(t=>push({w:t.w}));W.T.filter(t=>t.r==='+'&&t.w&&!t.w.includes(' ')&&t.lvl!=='izole'&&t.lvl!=='hece').forEach(t=>push({w:t.w}));
 sounds.forEach(s=>shuffle(poolFor(s,'karisik')).slice(0,10).forEach(push));if(items.length<10)shuffle(WB).slice(0,10).forEach(push);
 const days=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];const plan=days.map((d,i)=>({d,g:HOME_GAMES[i%HOME_GAMES.length],items:[0,1,2,3,4].map(k=>items[(i*3+k)%items.length])}));wkObj(wk).plan=plan;save();return plan}

async function worksOf(list,n){const out=[];for(const w of list.slice(0,n||8)){try{const d=await idbGet('work:'+w.id);if(d)out.push({w,src:d.th||d.img})}catch(e){}}return out}
async function recsForReport(wk){const W=weekData(wk);let list=W.recs.filter(r=>r.star);if(!list.length)list=W.recs.slice(0,4);const out=[];for(const r of list.slice(0,8)){const b=await idbGet('rec:'+r.id);if(!b)continue;let first=null;if(r.w){const older=S.recs.filter(x=>x.w===r.w&&x.id!==r.id&&new Date(x.date)<new Date(r.date)&&weekKey(x.date)!==wk).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];if(older){const ob=await idbGet('rec:'+older.id);if(ob)first={r:older,src:await blobToData(ob)}}}out.push({r,src:await blobToData(b),first})}return out}

function sndBlock(s,o,pv,tr){const d=o&&pv&&pv.n?o.acc-pv.acc:null;const lv=Object.entries(o.lv).map(([k,v])=>`<span>${esc(LV[k]||k)}: %${pct(v.p,v.n)} (${v.n})</span>`).join('');const ps=Object.entries(o.ps).filter(([k])=>k!=='karisik').map(([k,v])=>`<span>${esc(POS[k])}: %${pct(v.p,v.n)}</span>`).join('');
 return `<div class="snd"><div class="L">${esc(s.toLocaleUpperCase('tr'))}</div><div><div><span class="big">%${o.acc}</span> doğru${d!=null?`<span class="dl ${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)} puan</span>`:''}</div><div class="hb" style="background:linear-gradient(90deg,${accColor(o.acc)} ${o.acc}%,#eceef5 ${o.acc}%)"></div><div class="m">✅ ${o.p} doğru · 🟡 ${o.y} ipucuyla · ⏳ ${o.m} henüz · ipucuyla birlikte %${o.cueAcc}</div><div class="ch">${lv}${ps}</div></div><div class="sp">${spark(tr,230,64,accColor(o.acc))}<div class="m" style="text-align:center">Son 8 hafta · kesikli çizgi = %80 hedef</div></div></div>`}
function wordsHTML(words,interactive){const E=Object.entries(words).sort((a,b)=>({'+':0,'~':1,'-':2}[a[1]]-{'+':0,'~':1,'-':2}[b[1]]));if(!E.length)return '<p class="m">Bu dönemde kelime kaydı yok.</p>';return `<div class="ws">${E.map(([w,r])=>interactive?`<button class="w ${r==='+'?'p':r==='~'?'y':''}" data-say="${esc(w)}">${esc(emojiOf(w))} ${esc(w)} ${RI[r]}</button>`:`<span class="w ${r==='+'?'p':r==='~'?'y':''}">${esc(emojiOf(w))} ${esc(w)} ${RI[r]}</span>`).join('')}</div><p class="lg" style="margin-top:8px">✅ Kendi başına doğru · 🟡 İpucuyla doğru · ⏳ Çalışıyoruz${interactive?' · Kelimeye dokununca sesli okunur':''}</p>`}
function actsHTML(acts){const E=Object.entries(acts).filter(([a])=>GAME_N[a]);return E.length?`<div class="as">${E.map(([a,v])=>`<div class="a"><b>${GAME_N[a]}</b><span>${v.ok} başarılı${v.tr?' · '+v.tr+' deneme daha':''}</span></div>`).join('')}</div>`:''}
function paHTML(pa){const E=Object.entries(pa);return E.length?E.map(([k,v])=>`<div class="pr"><span>${PA_N[k]}</span><div class="bar"><i style="width:${pct(v.ok,v.n)}%;background:${accColor(pct(v.ok,v.n))}"></i></div><b>%${pct(v.ok,v.n)}</b></div>`).join('')+'<p class="m">Sesleri duyup ayırt etme ve kelimeyi parçalarına ayırma becerileri, doğru konuşmanın temelidir.</p>':''}
function progHTML(){return S.units.map(u=>{const p=unitProg(u);return `<div class="pr"><span>${esc(u.icon||'📘')} ${esc(u.title)}</span><div class="bar"><i style="width:${p}%"></i></div><b>%${p}</b></div>`}).join('')}
function goalsRep(){const G=S.profile.goals||[];return G.length?G.map(g=>`<div class="goal"><span>${g.st==='tamam'?'✅':'🎯'}</span><span>${esc(g.t)}${g.st==='tamam'&&g.done?` <span class="m">— ${fmtS(g.done)} ulaşıldı</span>`:''}</span></div>`).join(''):''}
function footHTML(){const st=S.settings;return `<div class="ft">🤖 Robot garajı: ${PARTS.slice(0,S.parts).map(p=>p.split(' ')[0]).join(' ')||'ilk parça yolda!'} · Toplam ⭐ ${S.stars}<br>${esc(st.teacher)} · Dil & Konuşma Özel Ders Takip Sistemi</div>`}

 const sounds=Object.keys(W.snd).sort((a,b)=>SKEYS.indexOf(a)-SKEYS.indexOf(b));const moods=W.ss.map(s=>s.mood).filter(Boolean).join(' ');const att=W.ss.filter(s=>s.att);const attAvg=att.length?(att.reduce((a,s)=>a+s.att,0)/att.length).toFixed(1):null;
 const tips=[...new Set((sounds.length?sounds:activeSounds()).map(s=>SOUND_TIP[s]).filter(Boolean))].slice(0,3);

 const pa=paHTML(W.pa);if(pa)h+=`<div class="sec"><h2>🧠 Ses farkındalığı (fonolojik beceriler)</h2>${pa}</div>`;
 h+=`<div class="sec"><h2>🗣️ Bu hafta çalıştığımız kelimeler</h2>${wordsHTML(W.words,I)}</div>`;

 if(I&&recs.length)h+=`<div class="sec"><h2>🎧 ${esc(st.student)}'in sesinden</h2>${recs.map(x=>`<div class="rec"><b>${esc(emojiOf(x.r.w))} ${esc(x.r.w||'Kayıt')}<small>${fmtS(x.r.date)}${x.r.s?' · /'+esc(x.r.s)+'/':''}</small></b>${x.first?`<div><small>İlk kayıt · ${fmtS(x.first.r.date)}</small><audio controls preload="none" src="${x.first.src}"></audio></div><div><small>Bu hafta</small><audio controls preload="none" src="${x.src}"></audio></div>`:`<audio controls preload="none" src="${x.src}"></audio>`}</div>`).join('')}<p class="m">Kulaklıkla dinlemenizi öneririm. “İlk kayıt” ile karşılaştırınca gelişimi duyabilirsiniz.</p></div>`;
 else if(!I&&W.recs.length)h+=`<div class="sec"><h2>🎧 Ses kayıtları</h2><p>Bu hafta ${W.recs.length} ses kaydı alındı. Dinlemek için interaktif veli panelini açın.</p></div>`;
 if(W.ss.length)h+=`<div class="sec"><h2>📅 Ders günlüğü</h2><table><tr><th>Gün</th><th>Çalışılan</th><th>Doğru</th><th></th></tr>${W.ss.map(s=>{const d=sessData(s);return `<tr><td><b>${dayN(s.date)}</b><br><span class="m">${fmtS(s.date)}${d.mins?' · '+d.mins+' dk':''}</span></td><td>${Object.keys(d.snd).map(k=>'/'+esc(k)+'/').join(' ')||''} ${d.units.map(u=>esc(u.title)).join(', ')}${s.pages?`<br><span class="m">Sayfa ${esc(s.pages)}</span>`:''}${s.notes?`<br><span class="m">${esc(s.notes)}</span>`:''}</td><td>${d.n?'%'+pct(d.p,d.n):'—'}</td><td>${s.mood||''}${s.att?' '+s.att+'/5':''}</td></tr>`}).join('')}</table>${moods||attAvg?`<p class="m" style="margin-top:6px">Ruh hali: ${moods||'—'}${attAvg?` · Ortalama dikkat/katılım: ${attAvg}/5`:''}</p>`:''}</div>`;

function panelScript(wk){const st=S.settings;return `(function(){var K='veli_${wk}';var tr=null;function pv(){try{var v=speechSynthesis.getVoices();tr=v.find(function(x){return /^tr/i.test(x.lang)})||null}catch(e){}}if(window.speechSynthesis){pv();speechSynthesis.onvoiceschanged=pv}
document.addEventListener('click',function(e){var b=e.target.closest('[data-say]');if(!b||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(b.getAttribute('data-say'));u.lang='tr-TR';u.rate=.8;if(tr)u.voice=tr;speechSynthesis.speak(u)});

 if(c.lvl==='hece'){const y=sylls(s);const list=c.pos==='son'?y.vc:c.pos==='orta'?y.vcv:c.pos==='bas'?y.cv:y.cv.concat(y.vc,y.vcv);return shuffle(list.concat(list)).slice(0,N).map(x=>({w:x,e:'',say:x,syl:true,lvl:'hece',base:x}))}
 if(c.lvl==='konusma')return targetWords(N).map(x=>({w:x.w,e:x.e,say:'Bunu anlat bakalım: '+x.w,base:x.w,lvl:'konusma',talk:true}));
 return targetWords(N).map(wordItem)}

 const card=it.syl?`<div class="syl"><span>${esc(it.w)}</span></div><div class="dW" style="font-size:22px">${SOUNDS[s].e}</div>`:`<div class="dE">${esc(it.e)}</div><div class="dW">${it.lvl==='izole'?esc(it.w):hlWord(it.w,s)}</div>${it.talk?'<div class="mut">Ne görüyorsun? Anlat bakalım!</div>':''}`;

/* --- 2. Minimal Çift --- */

function actMinimal(){const st=child.st||(child.st={r:0,mode:null});if(!st.mode)return kid(`<div class="khello" style="justify-content:center"><span class="kro">🎯</span><span><b>Minimal Çift</b><small>Robot doğru resme gitsin!</small></span></div><div class="mode2"><button class="kbtn" onclick="mpMode('d')">👂 Dinle, bul</button><button class="kbtn alt" onclick="mpMode('s')">🗣️ Söyle, robot gitsin</button></div><p class="mut" style="max-width:520px;text-align:center">Dinle: robot iki benzer kelimeden birini söyler, ${esc(S.settings.student)} doğru resmi seçer. Söyle: ${esc(S.settings.student)} parlayan resmi söyler; öğretmen <b>duyduğu</b> resme dokunur ve robot oraya gider.</p>`);

 const P=st.p;const opts=['a','b'];const card=k=>`<button class="kcard ${st.mode==='s'&&k===st.tg?'tgt':''} ${st.mode==='d'&&st.fails>=2&&k===st.tg?'hint':''} ${st.bad===k?'shake':''}" onclick="mpTap('${k}')">${esc(P[k][0])}<span class="cap">${esc(P[k][1])}</span></button>`;

/* --- 3. Kod Yolu --- */
const DIRS={u:[-1,0,'⬆️','yukarı'],d:[1,0,'⬇️','aşağı'],l:[0,-1,'⬅️','sola'],r:[0,1,'➡️','sağa']};
function bfs(N,R,T,W){const seen=new Set([R+'']);const q=[R];while(q.length){const [a,b]=q.shift();if(a===T[0]&&b===T[1])return true;for(const d of Object.values(DIRS)){const n=[a+d[0],b+d[1]],k=n+'';if(n[0]<0||n[1]<0||n[0]>=N||n[1]>=N||W.has(k)||seen.has(k))continue;seen.add(k);q.push(n)}}return false}
function genRobot(r){const N=5;const want=Math.min(2+r,6);for(let k=0;k<300;k++){const R=[ri(N),ri(N)],T=[ri(N),ri(N)];const d=Math.abs(R[0]-T[0])+Math.abs(R[1]-T[1]);if(d<Math.max(2,want-1)||d>want+1)continue;const W=new Set();const nw=r<2?0:Math.min(r,3);let g=0;while(W.size<nw&&g++<50){const k2=[ri(N),ri(N)]+'';if(k2!==R+''&&k2!==T+'')W.add(k2)}if(bfs(N,R,T,W))return{N,R,T,W:[...W],pos:R.slice(),prog:[],run:false,step:-1,bad:-1}}return{N,R:[2,0],T:[2,2],W:[],pos:[2,0],prog:[],run:false,step:-1,bad:-1}}
function actRobot(){const st=child.st||(child.st={r:0,words:targetWords(ROUNDS.robot)});if(st.r>=ROUNDS.robot)return finishAct();if(!st.g){st.g=genRobot(st.r);st.word=st.words[st.r];setTimeout(()=>say('Robotu '+st.word.w+' yanına götür.'),350)}const g=st.g;let cells='';
for(let i=0;i<g.N;i++)for(let j=0;j<g.N;j++){const k=i+','+j;const isR=g.pos[0]===i&&g.pos[1]===j,isT=g.T[0]===i&&g.T[1]===j,isW=g.W.includes(k);cells+=`<div class="rc ${isW?'w':''} ${isT?'t':''}">${isR?'🤖':isT?esc(st.word.e):isW?'🧱':''}</div>`}
const prog=g.prog.map((c,i)=>`<span class="pc ${g.step===i?'on':''} ${g.bad===i?'bad':''}">${DIRS[c][2]}</span>`).join('')||'<span class="mut">Oklara bas, robotun yolunu yaz 👇</span>';const dis=g.run?'disabled':'';const b=d=>`<button onclick="rAdd('${d}')" ${dis}>${DIRS[d][2]}</button>`;
kid(`<div class="kq"><button class="kbig" onclick="say('Robotu '+child.st.word.w+' yanına götür')">🔊</button>${dots(st.r,ROUNDS.robot)}</div><div class="rg">${cells}</div><div class="prog">${prog}</div><div class="pad"><span></span>${b('u')}<span></span>${b('l')}<button class="go" onclick="rRun()" ${g.run||!g.prog.length?'disabled':''}>▶️</button>${b('r')}<span></span>${b('d')}<button class="del" onclick="rDel()" ${dis}>↩️</button></div>`)}
function rAdd(d){const g=child.st.g;if(g.run||g.prog.length>=14)return;g.prog.push(d);g.bad=-1;g.pos=g.R.slice();say(DIRS[d][3]);render()}
function rDel(){const g=child.st.g;if(g.run)return;g.prog.pop();g.bad=-1;g.pos=g.R.slice();render()}
function rRun(){const st=child.st,g=st.g;if(g.run||!g.prog.length)return;g.run=true;g.pos=g.R.slice();g.step=-1;g.bad=-1;render();let i=0;
const reset=ms=>setTimeout(()=>{if(child&&child.st===st){g.pos=g.R.slice();g.step=-1;render()}},ms);
const tick=()=>{if(!child||child.st!==st)return;if(i>=g.prog.length){g.run=false;logIt('robot',st.word.w,false);say('Biraz daha kaldı. Yolu tamamlayalım.');render();reset(1200);return}const c=g.prog[i];const np=[g.pos[0]+DIRS[c][0],g.pos[1]+DIRS[c][1]];g.step=i;
if(np[0]<0||np[1]<0||np[0]>=g.N||np[1]>=g.N||g.W.includes(np+'')){g.run=false;g.bad=i;logIt('robot',st.word.w,false);say('Hop! '+(i+1)+'. adımda robot takıldı. Düzeltelim.');render();reset(1300);return}
g.pos=np;render();if(np[0]===g.T[0]&&np[1]===g.T[1]){g.run=false;logIt('robot',st.word.w,true);const it=wordItem(st.word);say('Robot '+st.word.w+' buldu! Sen de söyle: '+it.say);setTimeout(()=>trialPanel(it,()=>{st.r++;st.g=null;render()}),800);return}i++;setTimeout(tick,560)};setTimeout(tick,420)}

function pieces(e,n,bg){const Z=360,c=document.createElement('canvas');c.width=c.height=Z;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,Z,Z);x.textAlign='center';x.textBaseline='middle';x.font=`${Math.round(Z*.7)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;x.fillText(e,Z/2,Z/2+Z*.04);const out=[],p=Z/n;for(let r=0;r<n;r++)for(let q=0;q<n;q++){const d=document.createElement('canvas');d.width=d.height=p;d.getContext('2d').drawImage(c,q*p,r*p,p,p,0,0,p,p);out.push(d.toDataURL())}return out}
const PZBG=['#e0e7ff','#fce7f3','#dcfce7','#fef3c7','#e0f2fe'];
function actPuzzle(){const st=child.st||(child.st={r:0,words:targetWords(ROUNDS.puzzle)});if(st.r>=ROUNDS.puzzle)return finishAct();if(!st.p){const w=st.words[st.r];const n=st.r<1?2:3;const imgs=pieces(w.e,n,PZBG[st.r%PZBG.length]);let ord=shuffle(imgs.map((_,i)=>i));while(ord.every((v,i)=>v===i))ord=shuffle(ord);st.p={w,n,imgs,ord,sel:-1};setTimeout(()=>say('Yapboz zamanı! Parçaları yerine koy.'),350)}const p=st.p;
kid(`<div class="kq"><div class="pzprev">${esc(p.w.e)}</div>${dots(st.r,ROUNDS.puzzle)}</div><div class="pz" style="grid-template-columns:repeat(${p.n},1fr)">${p.ord.map((v,i)=>`<img src="${p.imgs[v]}" class="${p.sel===i?'sel':''} ${v===i?'ok':''}" onclick="pzTap(${i})" alt="">`).join('')}</div><p class="mut">İki parçaya dokun, yer değiştirsinler.</p>`)}
function pzTap(i){const st=child.st,p=st.p;if(!p||p.done)return;if(p.sel<0){p.sel=i;render();return}if(p.sel===i){p.sel=-1;render();return}const a=p.sel;[p.ord[a],p.ord[i]]=[p.ord[i],p.ord[a]];p.sel=-1;render();if(p.ord.every((v,k)=>v===k)){p.done=true;logIt('puzzle',p.w.w,true);const it=wordItem(p.w);say('Tamamlandı! Sen de söyle: '+it.say);setTimeout(()=>trialPanel(it,()=>{st.r++;st.p=null;render()}),900)}}

function openLetterBoard(fromChild){const s=(child&&child.cfg&&child.cfg.s)||curCfg().s||activeSounds()[0]||'a';openBoard({bg:makePaper(s),title:`Harf: ${s.toLocaleUpperCase('tr')} ${s}`,letter:s,fromChild:!!fromChild});if(fromChild)say(`Haydi ${s} harfini yazalım! Noktaların üstünden git.`)}
function openBlankBoard(){openBoard({bg:makePaper(null),title:'Boş tahta'})}
async function openBoard(o){Object.assign(B,{on:true,strokes:[],redo:[],bg:o.bg,title:o.title||'',key:o.key||null,book:o.book||null,page:o.page||0,letter:o.letter||null,fromChild:!!o.fromChild});if(B.key){try{const s=await idbGet(B.key);if(Array.isArray(s))B.strokes=s}catch(e){}}B.aspect=await imgAspect(B.bg);bUI();bLayout();bBroadcastInit()}
function imgAspect(src){return new Promise(r=>{if(!src)return r(1.6);const i=new Image();i.onload=()=>r(i.naturalWidth/i.naturalHeight||1.6);i.onerror=()=>r(1.6);i.src=src})}
function bUI(){const el=$('#board');const g=B.guest;const letters=activeSounds().length?activeSounds():['a','e','r','s','k'];
 el.innerHTML=`<div class="btool">${g?'':'<button onclick="closeBoard()" title="Kapat">✖</button>'}<b>${esc(B.title||'Yazı tahtası')}</b><span class="sep"></span>
 ${PEN_COLORS.map(c=>`<button class="sw ${B.color===c&&B.mode!=='er'?'on':''}" style="background:${c}" onclick="bSet('color','${c}')"></button>`).join('')}<span class="sep"></span>
 ${PEN_SIZES.map((s,i)=>`<button class="sz ${B.size===i?'on':''}" onclick="bSet('size',${i})"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}<span class="sep"></span>
 <button class="${B.mode==='pen'?'on':''}" onclick="bSet('mode','pen')">✏️</button><button class="${B.mode==='hl'?'on':''}" onclick="bSet('mode','hl')">🖍️</button><button class="${B.mode==='er'?'on':''}" onclick="bSet('mode','er')">🧽</button><button onclick="bUndo()">↩️</button><button onclick="bClear()">🗑️</button>
 ${B.book&&!g?`<span class="sep"></span><button onclick="bPage(-1)">◀</button><button onclick="bPage(1)">▶</button>`:''}${B.letter&&!g?`<span class="sep"></span>${letters.map(l=>`<button class="${B.letter===l?'on':''}" onclick="bLetter('${l}')" style="font-weight:800">${esc(l.toLocaleUpperCase('tr'))}</button>`).join('')}`:''}
 <span class="sep"></span><button onclick="${g?'':'shareBoard()'}" title="Başka cihaza bağla">${B.peer?(B.conns.length||B.host?'📡✅':'📡…'):'📡'}</button>${document.fullscreenEnabled?'<button onclick="bFull()">⛶</button>':''}<button class="save" onclick="bSave()">${B.fromChild?'✅ Bitti':'💾 Kaydet'}</button></div>
 <div class="bstage" id="bstage"><div class="bpage" id="bpage">${B.bg?`<img src="${B.bg}" alt="">`:''}<canvas id="bcv"></canvas></div>${B.note?`<div class="bnote">${esc(B.note)}</div>`:''}</div>`;
 el.classList.add('on');const cv=$('#bcv');B.cv=cv;B.ctx=cv.getContext('2d');bindDraw(cv)}
function bNote(t){B.note=t;const n=document.querySelector('.bnote');if(n)n.textContent=t;else if(B.on){const st=$('#bstage');if(st)st.insertAdjacentHTML('beforeend',`<div class="bnote">${esc(t)}</div>`)}clearTimeout(B._nt);if(t)B._nt=setTimeout(()=>{B.note='';const n2=document.querySelector('.bnote');if(n2)n2.remove()},4000)}
function bLayout(){const st=$('#bstage'),pg=$('#bpage');if(!st||!pg)return;const aw=st.clientWidth-16,ah=st.clientHeight-16;let w=aw,h=w/B.aspect;if(h>ah){h=ah;w=h*B.aspect}pg.style.width=w+'px';pg.style.height=h+'px';const dpr=Math.min(2,window.devicePixelRatio||1);B.W=w;B.H=h;B.cv.width=Math.round(w*dpr);B.cv.height=Math.round(h*dpr);B.ctx.setTransform(dpr,0,0,dpr,0,0);bRedraw()}
window.addEventListener('resize',()=>{if(B.on)bLayout()});
function bSet(k,v){B[k]=v;if(k==='color'&&B.mode==='er')B.mode='pen';bUI();bLayout()}
function strokeStyle(g,s){const w=Math.max(1,s.w*B.W);g.lineCap='round';g.lineJoin='round';g.lineWidth=s.m==='hl'?w*3.2:s.m==='er'?w*3:w;g.globalCompositeOperation=s.m==='er'?'destination-out':'source-over';g.globalAlpha=s.m==='hl'?.32:1;g.strokeStyle=s.c;g.fillStyle=s.c}
function drawStroke(g,s,W,H){const p=s.pts;if(!p.length)return;strokeStyle(g,s);if(W!==B.W)g.lineWidth=g.lineWidth*W/B.W;if(p.length===1){g.beginPath();g.arc(p[0][0]*W,p[0][1]*H,g.lineWidth/2,0,7);g.fill();return}g.beginPath();g.moveTo(p[0][0]*W,p[0][1]*H);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;g.quadraticCurveTo(p[i][0]*W,p[i][1]*H,mx*W,my*H)}const l=p[p.length-1];g.lineTo(l[0]*W,l[1]*H);g.stroke()}
function bRedraw(){const g=B.ctx;if(!g)return;g.save();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,B.cv.width,B.cv.height);g.restore();B.strokes.forEach(s=>{g.save();drawStroke(g,s,B.W,B.H);g.restore()})}
function bindDraw(cv){const pt=e=>{const r=cv.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
 cv.addEventListener('pointerdown',e=>{if(S.settings.penOnly&&e.pointerType==='touch'&&!B.guest)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}const s={id:uid(),c:B.color,w:PEN_SIZES[B.size],m:B.mode,pts:[pt(e)]};B.cur=s;B.strokes.push(s);B.redo=[];bRedraw()});
 cv.addEventListener('pointermove',e=>{const s=B.cur;if(!s)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>s.pts.push(pt(ev)));const g=B.ctx;g.save();const n=s.pts.length;drawStroke(g,{c:s.c,w:s.w,m:s.m,pts:s.pts.slice(Math.max(0,n-evs.length-2))},B.W,B.H);g.restore();const now=Date.now();if(now-B.lastSend>70){B.lastSend=now;bSend({t:'s',s})}});
 const end=e=>{const s=B.cur;if(!s)return;B.cur=null;if(s.m==='hl')bRedraw();bSend({t:'s',s});bPersist()};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end)}
function bPersist(){if(!B.key||B.guest)return;clearTimeout(B._ps);B._ps=setTimeout(()=>{idbSet(B.key,B.strokes.map(s=>({id:s.id,c:s.c,w:s.w,m:s.m,pts:s.pts}))).catch(()=>{})},400)}
function bUndo(){const s=B.strokes.pop();if(!s)return;B.redo.push(s);bRedraw();bSend({t:'undo',id:s.id});bPersist()}
function bClear(){if(!B.strokes.length||!confirm('Sayfadaki tüm yazılar silinsin mi?'))return;B.strokes=[];bRedraw();bSend({t:'clear'});bPersist()}
async function bPage(d){const b=bookOf(B.book);if(!b)return;const n=B.page+d;if(n<1||n>b.pages)return;busy('Sayfa '+n+'…');try{const bg=await pageImg(b.id,n,1400,.82);B.page=n;B.bg=bg;B.key=`ann:${b.id}:${n}`;B.title=`${b.name} · s.${n}`;B.strokes=[];try{const s=await idbGet(B.key);if(Array.isArray(s))B.strokes=s}catch(e){}B.aspect=await imgAspect(bg);pvPage=n;bUI();bLayout();bBroadcastInit()}catch(e){toast(e.message)}finally{busy(false)}}
function bLetter(l){B.letter=l;B.bg=makePaper(l);B.title=`Harf: ${l.toLocaleUpperCase('tr')} ${l}`;B.strokes=[];bUI();bLayout();bBroadcastInit();say(l)}
function bFull(){try{if(document.fullscreenElement)document.exitFullscreen();else $('#board').requestFullscreen()}catch(e){}}
async function bComposite(maxW){const W=Math.min(maxW||1400,Math.round(1400)),H=Math.round(W/B.aspect);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);if(B.bg){const i=new Image();await new Promise(r=>{i.onload=i.onerror=r;i.src=B.bg});g.drawImage(i,0,0,W,H)}const ink=document.createElement('canvas');ink.width=W;ink.height=H;const ig=ink.getContext('2d');B.strokes.forEach(s=>{ig.save();drawStroke(ig,s,W,H);ig.restore()});g.drawImage(ink,0,0);return c}
async function bSave(){if(!B.strokes.length&&!confirm('Sayfa boş. Yine de kaydedilsin mi?'))return;busy('Kaydediliyor…');try{const c=await bComposite(1400);const img=c.toDataURL('image/jpeg',.85);if(B.guest){busy(false);return offerShare(await dataToBlob(img),`yazi_${dISO(Date.now())}.jpg`,'image/jpeg')}
 const t=document.createElement('canvas');t.width=480;t.height=Math.round(480/B.aspect);t.getContext('2d').drawImage(c,0,0,t.width,t.height);const th=t.toDataURL('image/jpeg',.8);const id=uid();await idbSet('work:'+id,{img,th});const ses=ensureSession();S.works.unshift({id,date:new Date().toISOString(),title:B.title,sid:ses.id});ses.works.push(id);if(B.letter)logIt('yazi',B.letter,true);save();bPersist();toast('✍️ Çalışma kaydedildi — veli raporuna eklenecek');
 if(B.fromChild){closeBoard();const c2=ensureSession();if(!c2.done.includes('yazi'))c2.done.push('yazi');addStar(2);render();celebrate('Harika yazdın '+S.settings.student+'!','✍️')}}catch(e){toast('Kaydedilemedi: '+e.message)}finally{busy(false)}}
function closeBoard(){B.on=false;$('#board').classList.remove('on');$('#board').innerHTML='';if(B.peer&&!B.guest){try{B.peer.destroy()}catch(e){}B.peer=null;B.conns=[]}if(child)render();else if(view==='kayit')render()}

/* ---- Peer bağlantısı ---- */
const PEERJS='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',QRJS='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
function bInitMsg(){return {t:'init',bg:B.bg,aspect:B.aspect,title:B.title,strokes:B.strokes}}
function bBroadcastInit(){if(!B.peer||B.guest)return;B.conns.forEach(c=>{try{c.open&&c.send(bInitMsg())}catch(e){}})}
function bSend(m,except){if(B.guest){try{B.host&&B.host.open&&B.host.send(m)}catch(e){}return}B.conns.forEach(c=>{if(c!==except){try{c.open&&c.send(m)}catch(e){}}})}
function bOnData(d,from){if(!d||!d.t)return;if(d.t==='init'){B.bg=d.bg;B.aspect=d.aspect||1.6;B.title=d.title;B.strokes=d.strokes||[];bUI();bLayout();return}
 if(d.t==='s'){const i=B.strokes.findIndex(x=>x.id===d.s.id);if(i>=0)B.strokes[i]=d.s;else B.strokes.push(d.s);bRedraw();if(!B.guest){bSend(d,from);bPersist()}}
 else if(d.t==='undo'){B.strokes=B.strokes.filter(x=>x.id!==d.id);bRedraw();if(!B.guest){bSend(d,from);bPersist()}}
 else if(d.t==='clear'){B.strokes=[];bRedraw();if(!B.guest){bSend(d,from);bPersist()}}}
function joinUrl(code){return location.origin+location.pathname+'?tahta='+code}
async function shareBoard(){if(B.peer){return showShare()}if(location.protocol==='file:'){modal(`<h3>📡 Cihazlar arası bağlantı</h3><p>Bağlantı için sistemi <b>internet adresinden</b> açman gerekiyor (ör. GitHub Pages sitende). Dosyadan açıldığında diğer cihaz aynı adrese ulaşamaz.</p><button class="btn" onclick="closeModal()">Tamam</button>`);return}
 busy('Bağlantı hazırlanıyor…');try{await loadJs(PEERJS);await startHost(String(1000+ri(9000)))}catch(e){busy(false);toast(e.message)}}
function startHost(code){return new Promise((res,rej)=>{let p;try{p=new Peer('metedk-'+code,{debug:0})}catch(e){return rej(e)}B.peer=p;B.code=code;B.conns=[];
 p.on('open',()=>{busy(false);bUI();bLayout();showShare();res()});
 p.on('connection',c=>{c.on('open',()=>{B.conns.push(c);try{c.send(bInitMsg())}catch(e){}bUI();bLayout();closeModal();bNote('📱 Cihaz bağlandı! Yazdıklarınız eşleniyor.')});c.on('data',d=>bOnData(d,c));c.on('close',()=>{B.conns=B.conns.filter(x=>x!==c);if(B.on){bUI();bLayout()}})});
 p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch(x){}B.peer=null;startHost(String(1000+ri(9000))).then(res,rej)}else{busy(false);toast('Bağlantı hatası: '+e.type);}});
 p.on('disconnected',()=>{setTimeout(()=>{try{p.reconnect()}catch(x){}},1500)})})}
async function showShare(){const url=joinUrl(B.code);modal(`<h3>📡 Tahta / tablet bağla</h3><p class="mut">Diğer cihazda (akıllı tahta, tablet, telefon) kamerayla QR'ı okut ya da adresi aç. Aynı sayfayı görür, biri yazınca diğerinde anında belirir.</p><div class="qrbox" id="qr"></div><div class="code">${B.code}</div><p class="mut" style="word-break:break-all;text-align:center">${esc(url)}</p><p style="text-align:center"><b>${B.conns.length}</b> cihaz bağlı</p><div class="mbtns"><button class="btn ghost" onclick="copyText('${Q(url)}')">📋 Adresi kopyala</button><button class="btn" onclick="closeModal()">Tamam</button></div>`);try{await loadJs(QRJS);new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').textContent='QR oluşturulamadı (internet?)'}}
async function joinBoard(code){B.guest=true;B.on=true;B.title='Bağlanıyor…';B.bg=makePaper(null);B.aspect=1.6;document.body.style.paddingBottom='0';bUI();bLayout();bNote('📡 Öğretmenin tahtasına bağlanılıyor… ('+code+')');
 try{await loadJs(PEERJS)}catch(e){return bNote('İnternet bağlantısı gerekli')}const p=new Peer({debug:0});B.peer=p;p.on('open',()=>{const c=p.connect('metedk-'+code,{reliable:true});B.host=c;c.on('open',()=>{bNote('✅ Bağlandı! Yazmaya başlayabilirsin.');bUI();bLayout()});c.on('data',d=>bOnData(d,c));c.on('close',()=>{bNote('Bağlantı koptu — öğretmen tahtayı kapattı mı?');B.host=null;bUI();bLayout()})});p.on('error',e=>bNote(e.type==='peer-unavailable'?'Bu kodla açık tahta bulunamadı. Öğretmen cihazında 📡 açık mı?':'Bağlantı hatası: '+e.type))}

/* ================== BAŞLAT ================== */
(function boot(){const q=new URLSearchParams(location.search);const t=q.get('tahta');if(t){joinBoard(t.replace(/\D/g,''));return}render()})();

</script>
